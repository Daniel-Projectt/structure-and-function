<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Structure &amp; Function &mdash; Study Lab</title>
<meta name="description" content="Anatomy and physiology study lab: spaced-repetition flashcards, practice exams with second-order application questions, matching, and labeled diagrams with hidden labels.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Structure &amp; Function Study Lab">
<meta property="og:url" content="https://daniel-projectt.github.io/structure-and-function/">
<meta property="og:title" content="Structure &amp; Function &mdash; Study Lab">
<meta property="og:description" content="Spaced-repetition flashcards, practice exams with application questions, matching and labeled diagrams.">
<meta property="og:image" content="https://daniel-projectt.github.io/structure-and-function/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<style>
:root{
  --bg:#ffffff;
  --surface:#ffffff;
  --surface-2:#f7f7f5;
  --surface-3:#efefec;
  --ink:#141414;
  --ink-2:#3d3d3d;
  --muted:#6f6f6f;
  --line:#e3e3e0;
  --line-2:#c9c9c4;
  --accent:#1f3a5f;
  --accent-soft:#eef2f7;
  --accent-ink:#1f3a5f;
  --apply:#7a3b2e;
  --apply-soft:#f6ecea;
  --ok:#2f6b45;
  --ok-soft:#eaf2ec;
  --bad:#9b3b30;
  --bad-soft:#f8ecea;
  --shadow:none;
  --shadow-lg:0 1px 2px rgba(0,0,0,.04);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"SF Mono",Menlo,monospace;
  --r:3px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--serif);font-weight:400;line-height:1.25;letter-spacing:.005em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lbl,.eyebrow,.glab,.mcol h3,.fcard .unitname,.tag,.qnum,.qcount,.chips,.counter{font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------------- masthead ---------------- */
.topbar{border-bottom:1px solid var(--line)}
.topbar .row{text-align:center;padding:38px 0 24px}
.brand{display:block}
.brand .mk{display:none}
.brand span{display:block;font-family:var(--serif);font-size:clamp(28px,5vw,40px);line-height:1.1;color:var(--ink);font-weight:400}
.brand small{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:12px}
.brand .sub{display:block;margin-top:10px;font-size:14.5px;color:var(--muted)}
.spacer{display:none}
.iconbtn{display:none}
.duepill{display:inline-block;margin-top:14px;font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.duepill b{font-weight:700;font-variant-numeric:tabular-nums}
.duepill::before{content:"";display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--accent);margin:0 7px 1px 0;vertical-align:middle}

/* ---------------- mode tabs ---------------- */
.modes{border-bottom:1px solid var(--line);background:var(--bg)}
.modes .inner{display:flex;justify-content:center;flex-wrap:wrap;gap:0;max-width:960px;margin:0 auto;padding:0 12px;width:100%}
.mode{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:14px 18px;font-family:var(--sans);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;min-height:46px}
.mode:hover{color:var(--ink)}
.mode[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* ---------------- unit bar ---------------- */
.unitbar{border-bottom:1px solid var(--line);background:var(--surface-2)}
.unitbar .row{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:12px 0}
select,.sel{font:inherit;font-size:14.5px;padding:7px 30px 7px 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--ink);cursor:pointer;
  appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236f6f6f' stroke-width='1.8'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 8px center;background-size:15px;max-width:100%}
.unitmeta{font-size:13px;color:var(--muted);font-style:italic}

/* ---------------- generic ---------------- */
main{padding:28px 0 72px}
.panel[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding:10px 16px;min-height:40px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);color:var(--ink-2);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#16304f;color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{font-size:10.5px;padding:7px 12px;min-height:34px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;border-right:1px solid var(--line);padding:8px 13px;font-family:var(--sans);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s;min-height:36px}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.tag{display:inline-block;padding:3px 8px;border:1px solid var(--line-2);border-radius:2px;font-size:9.5px;letter-spacing:.14em}
.tag.apply{color:var(--apply);border-color:#d9b9b2}
.tag.recall{color:var(--accent);border-color:#b9c6d6}
.empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:15px}
.h-sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.h-sec h2{font-size:22px}
.h-sec .sub{font-size:12.5px;color:var(--muted);font-style:italic}
.hintbar{font-size:13px;color:var(--muted);text-align:center;margin-top:14px;font-style:italic}
kbd{font:inherit;font-size:10.5px;font-family:var(--mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:3px;padding:1px 5px;background:var(--surface-2);color:var(--ink-2);font-style:normal}

/* ---------------- flashcards ---------------- */
.studyhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.chips{display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.chips b{color:var(--ink);font-weight:700}
.fcard{position:relative;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);min-height:330px;display:flex;flex-direction:column;cursor:pointer;overflow:hidden}
.fcard .top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.fcard .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 28px;gap:16px}
.fcard .front{font-family:var(--serif);font-size:clamp(21px,3.6vw,27px);line-height:1.3;max-width:34ch}
.fcard .back{border-top:1px solid var(--line);width:100%;padding-top:20px}
.fcard .ans{font-size:clamp(16px,2.6vw,18.5px);line-height:1.55;max-width:50ch;margin:0 auto;color:var(--ink)}
.fcard .why{margin:14px auto 0;max-width:52ch;font-size:13.5px;line-height:1.55;color:var(--ink-2);border-left:2px solid var(--accent);padding:2px 0 2px 14px;text-align:left}
.fcard .why b{color:var(--accent);font-weight:600}
.fcard .tapzone{font-size:12.5px;color:var(--muted);padding:0 0 20px;text-align:center;font-style:italic}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.rate button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);cursor:pointer;font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;transition:.15s;min-height:54px;color:var(--ink-2)}
.rate button span{font-size:10.5px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.rate button:hover{border-color:var(--accent);color:var(--accent)}
.rate button[data-q="0"]:hover{border-color:var(--bad);color:var(--bad)}
.bar{height:2px;background:var(--line);margin:16px 0 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .35s}

/* ---------------- exam ---------------- */
.setup{padding:26px 28px}
.setup .grp{margin-bottom:22px}
.setup .grp:last-of-type{margin-bottom:0}
.setup .glab{display:block;margin-bottom:9px}
.setup .note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.qcount{font-variant-numeric:tabular-nums}
.timer{font-variant-numeric:tabular-nums;font-family:var(--sans);font-size:12px;color:var(--muted)}
.timer.warn{color:var(--bad)}
.qbox{padding:28px 30px 24px}
.stem{font-family:var(--serif);font-size:clamp(17px,2.4vw,19.5px);line-height:1.55;margin:14px 0 0;max-width:64ch}
.stem .vig{display:block;font-family:var(--sans);font-size:14.5px;color:var(--ink-2);margin-bottom:12px;line-height:1.6}
.opts{display:grid;gap:8px;margin-top:22px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:12px 14px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);cursor:pointer;transition:.13s;font-size:14.5px;line-height:1.45;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:0 0 auto;width:20px;font-family:var(--sans);font-size:11px;font-weight:700;color:var(--muted);margin-top:2px}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{color:var(--bad)}
.opt:disabled{cursor:default}
.opt .why{display:block;font-size:12.8px;color:var(--ink-2);margin-top:5px;line-height:1.45}
.fb{margin-top:18px;padding:12px 0 0;font-size:14.2px;line-height:1.55;border-top:1px solid var(--line)}
.fb .lead{font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;display:block;margin-bottom:5px}
.fb.good .lead{color:var(--ok)}
.fb.bad .lead{color:var(--bad)}
.conf{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;font-style:italic}
.conf button{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:5px 11px;font-family:var(--sans);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;cursor:pointer;color:var(--muted);min-height:32px;font-style:normal}
.conf button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--line-2);transition:.2s}
.dots i.on{background:var(--accent);transform:scale(1.4)}
.dots i.ok{background:var(--ok)}
.dots i.no{background:var(--bad)}

/* results */
.res{padding:32px 28px}
.scorewrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center;text-align:center}
.ring{position:relative;width:132px;height:132px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:30px;font-variant-numeric:tabular-nums}
.ring .val small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.verdict{max-width:40ch;text-align:left}
.verdict h3{font-size:21px;margin-bottom:6px}
.verdict p{font-size:14px;color:var(--ink-2);line-height:1.55}
.breakdown{margin-top:26px;display:grid;gap:0;border-top:1px solid var(--line)}
.brow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;font-size:13.5px;padding:10px 0;border-bottom:1px solid var(--line)}
.brow .nm{color:var(--ink-2)}
.brow .sc{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.brow .mini{grid-column:1/-1;height:3px;background:var(--surface-3);overflow:hidden}
.brow .mini i{display:block;height:100%;background:var(--accent)}
.brow .mini i.low{background:var(--bad)}
.brow .mini i.mid{background:var(--apply)}
.misses{margin-top:26px;display:grid;gap:8px}
.miss{border:1px solid var(--line);border-radius:var(--r);padding:12px 15px}
.miss .q{font-size:14px;font-weight:600;line-height:1.45}
.miss .a{font-size:13.2px;color:var(--ink-2);margin-top:5px;line-height:1.5}
.miss .a b{color:var(--ok)}

/* ---------------- match ---------------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.mcol h3{margin-bottom:10px;text-align:center}
.tiles{display:grid;gap:8px}
.tile{padding:11px 13px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:14px;line-height:1.35;text-align:left;transition:.13s;min-height:48px}
.tile:hover{border-color:var(--accent)}
.tile.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tile.done{opacity:.3;pointer-events:none;border-style:dashed;border-color:var(--ok);color:var(--ok)}
.tile.bad{animation:shake .35s;border-color:var(--bad);background:var(--bad-soft)}
.tile.term{font-weight:600}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.banner{text-align:center;border:1px solid var(--ok);color:var(--ok);border-radius:var(--r);padding:12px;margin-bottom:16px;font-size:14px;font-style:italic}

/* ---------------- diagrams ---------------- */
.dgwrap{display:grid;gap:16px}
.dgstage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.dgart{position:relative;margin:0 auto;width:100%}
.dgstage svg.art{display:block;width:100%;height:auto}
.hot{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;cursor:pointer;z-index:2}
.pin{width:24px;height:24px;border-radius:99px;background:var(--surface);border:1.5px solid var(--accent);color:var(--accent);font-family:var(--sans);font-size:11.5px;font-weight:700;display:grid;place-items:center;transition:.15s;flex:0 0 auto}
.hot:hover .pin,.hot.shown .pin{background:var(--accent);color:#fff}
.hot .lab{margin-left:7px;background:var(--surface);border:1px solid var(--line-2);border-radius:2px;padding:3px 8px;font-family:var(--sans);font-size:12px;font-weight:600;white-space:nowrap;opacity:0;transform:translateX(-4px);transition:.18s;pointer-events:none;max-width:42vw;overflow:hidden;text-overflow:ellipsis}
.hot.shown .lab{opacity:1;transform:translateX(0)}
.hot.miss .pin{border-color:var(--bad);color:var(--bad)}
.hot.hit .pin{border-color:var(--ok);background:var(--ok);color:#fff}
.dglist{display:grid;gap:0;margin-top:4px;border-top:1px solid var(--line)}
.dgitem{display:flex;gap:12px;align-items:baseline;font-size:13.8px;padding:9px 2px;border-bottom:1px solid var(--line)}
.dgitem .n{flex:0 0 auto;width:20px;font-family:var(--sans);font-size:11px;font-weight:700;color:var(--accent)}
.dgitem .nm{font-weight:600}
.dgitem .ds{color:var(--ink-2);font-size:13px}

/* ---------------- plates ---------------- */
.plates{display:grid;gap:16px}
.plate{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:0;overflow:hidden}
.plimg{background:#fff;padding:14px;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line)}
.plimg img{max-width:100%;max-height:340px;height:auto;display:block}
.plimg.quiz{border:1px solid var(--line);border-radius:var(--r);max-width:420px;margin:0 auto}
.plimg.quiz img{max-height:300px}
.plimg.quiz.key{max-width:100%}
.plimg.quiz.key img{max-height:min(78vh,900px)}
.plate.wide{grid-template-columns:1fr}
.plate.wide .plimg{border-right:0;border-bottom:1px solid var(--line)}
.plate.wide .plimg img{max-height:none}
.pltext{padding:18px 22px}
.pltext h3{font-size:19px;margin-bottom:8px}
.pltext .cap{font-size:14px;line-height:1.55;color:var(--ink-2)}
.pltext .cap i{color:var(--ink);font-style:italic}
.find{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-family:var(--sans);font-size:11px;font-weight:600;padding:3px 8px;border:1px solid var(--line-2);border-radius:2px;color:var(--ink-2)}
.credit{font-size:11px;color:var(--muted);margin-top:12px;font-style:italic}
@media (max-width:720px){ .plate{grid-template-columns:1fr} .plimg{border-right:0;border-bottom:1px solid var(--line)} }

/* ---------------- progress ---------------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stat .n{font-family:var(--serif);font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:5px}
.stat.accent .n{color:var(--accent)}
.plist{display:grid;gap:0}
.prow{display:grid;grid-template-columns:1fr 92px 54px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:500;line-height:1.3}
.prow .nm small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.prow .track{height:3px;background:var(--surface-3);overflow:hidden}
.prow .track i{display:block;height:100%;background:var(--accent);transition:width .4s}
.prow .pc{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--muted)}
.callout{border-top:1px solid var(--line);padding:16px 0 0;font-size:14px;line-height:1.55;color:var(--ink-2);margin-top:20px}
.callout b{color:var(--ink)}

@media (max-width:720px){
  body{font-size:15.5px}
  .mgrid{grid-template-columns:1fr;gap:18px}
  .rate{grid-template-columns:repeat(2,1fr)}
  .qbox,.res,.setup{padding:20px 16px}
  .prow{grid-template-columns:1fr 60px 44px;gap:8px}
  .mode{padding:13px 12px;font-size:11px}
  .hot .lab{font-size:11.5px;padding:3px 7px}
}
@media print{
  .modes,.unitbar,.rate,.btn,.conf,.duepill{display:none!important}
  .card,.fcard{border-color:#bbb}
}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap row">
    <div class="brand">
      <span><small>Study Lab</small>Structure &amp; Function<span class="sub">Flashcards &middot; practice exams &middot; match &middot; diagrams</span></span>
    </div>
    <span class="duepill" id="duePill" hidden><b id="dueN">0</b> cards due</span>
  </div>
</header>
