UNITS.push({
id:"mus", name:"Muscle Tissue & Contraction", short:"Muscular",
blurb:"From sarcomere to whole muscle: how a nerve signal becomes force, and what happens when any step in that chain is blocked.",
cards:[
 {id:"mus-c1", f:"Four properties of muscle tissue", b:"Excitability (responds to stimuli), contractility (shortens), extensibility (stretches), elasticity (recoils).",
  why:"A muscle must be able to be stretched and return — contraction alone would be useless."},
 {id:"mus-c2", f:"Connective tissue layers of a muscle", b:"Endomysium wraps each fiber, perimysium wraps a bundle (fascicle), epimysium wraps the whole muscle. All three converge into the tendon.",
  why:"Force generated inside single cells is transmitted to bone only because these sheaths merge into one attachment."},
 {id:"mus-c3", f:"Sarcolemma and T tubules", b:"The sarcolemma is the muscle fiber's plasma membrane; T tubules are deep inward folds of it that carry the impulse into the fiber's interior.",
  why:"Without T tubules the surface signal would never reach the center, and the fiber would contract only at its edges."},
 {id:"mus-c4", f:"Sarcoplasmic reticulum", b:"Specialized smooth ER surrounding each myofibril that stores and releases calcium.",
  why:"It is the calcium reservoir. Everything about contraction timing depends on how fast it releases and reclaims calcium."},
 {id:"mus-c5", f:"Thick and thin filaments", b:"Thick filaments are myosin, with heads that bind actin. Thin filaments are actin, plus tropomyosin and troponin.",
  why:"Tropomyosin covers the binding sites; troponin is the calcium sensor that moves it. Both regulatory proteins sit on the thin filament."},
 {id:"mus-c6", f:"Sarcomere", b:"The contractile unit, running from one Z disc to the next.",
  why:"A muscle shortens because millions of sarcomeres each shorten a little, in series."},
 {id:"mus-c7", f:"Bands of the sarcomere", b:"A band = the full length of the thick filaments (dark). I band = thin filaments only (light). H zone = thick only. M line = center. Z disc = boundary.",
  why:"A band is the one that never changes length during contraction — the clearest evidence that filaments slide rather than shorten."},
 {id:"mus-c8", f:"Sliding filament theory", b:"During contraction, thin filaments are pulled toward the center of the sarcomere. The filaments themselves do not shorten.",
  why:"The I band and H zone narrow; the A band stays the same. Predicting these changes is a standard exam question."},
 {id:"mus-c9", f:"Neuromuscular junction", b:"The synapse between a motor neuron terminal and the muscle fiber's motor end plate, separated by the synaptic cleft.",
  why:"The nerve never touches the muscle. Every signal must cross chemically."},
 {id:"mus-c10", f:"Acetylcholine at the NMJ", b:"The nerve impulse opens calcium channels, vesicles release ACh, ACh binds receptors on the motor end plate, and sodium enters to depolarize the fiber.",
  why:"ACh is the only neurotransmitter used at the skeletal neuromuscular junction — which makes it a precise drug and toxin target."},
 {id:"mus-c11", f:"Acetylcholinesterase", b:"The enzyme in the synaptic cleft that breaks down ACh almost immediately after release.",
  why:"Without it, ACh would keep re-stimulating the fiber and the muscle could not relax — the mechanism of nerve agent poisoning."},
 {id:"mus-c12", f:"Excitation-contraction coupling", b:"Action potential travels the sarcolemma and down the T tubules → the SR releases calcium → calcium binds troponin → tropomyosin shifts → myosin binding sites on actin are exposed.",
  why:"This is the chain that converts an electrical event into a mechanical one. Know it step by step."},
 {id:"mus-c13", f:"Cross-bridge cycle", b:"Myosin head binds actin → power stroke pulls the thin filament → ATP binds and myosin detaches → ATP is hydrolyzed to re-cock the head.",
  why:"Two distinct jobs for ATP: one to let go, one to reset. Neither is the power stroke itself."},
 {id:"mus-c14", f:"Rigor mortis", b:"After death ATP production stops, so myosin heads cannot detach from actin and the muscle stays locked.",
  why:"The cleanest proof that ATP is required for release, not just for pulling."},
 {id:"mus-c15", f:"Relaxation", b:"ACh is broken down, the SR actively pumps calcium back in, troponin releases calcium, tropomyosin recovers the binding sites, and the fiber lengthens passively.",
  why:"Relaxation is active and costs ATP — pumping calcium back uphill is not free."},
 {id:"mus-c16", f:"Motor unit", b:"One motor neuron and all the muscle fibers it innervates. All of them contract together.",
  why:"Small motor units (a few fibers each) give fine control — eye and hand muscles. Large ones give power — thigh and back."},
 {id:"mus-c17", f:"Recruitment", b:"Increasing force by activating more motor units, generally smallest first.",
  why:"A single fiber is all-or-none, so graded force at the whole-muscle level must come from how many units are firing."},
 {id:"mus-c18", f:"Wave summation and tetanus", b:"Stimuli arriving before relaxation is complete add together; at high frequency the twitches fuse into a smooth, sustained contraction.",
  why:"Normal voluntary movement is tetanic. Individual twitches are a laboratory phenomenon."},
 {id:"mus-c19", f:"Isotonic vs. isometric contraction", b:"Isotonic: the muscle changes length and moves a load. Isometric: tension rises but length does not change.",
  why:"Holding a heavy box still is isometric work — exhausting even though nothing moves."},
 {id:"mus-c20", f:"Three energy systems", b:"Creatine phosphate (immediate, seconds), anaerobic glycolysis (fast, about 30–60 seconds, produces lactate), aerobic respiration (slow, sustained, requires oxygen).",
  why:"Which system dominates depends entirely on duration and intensity, not on the type of muscle."},
 {id:"mus-c21", f:"Excess post-exercise oxygen consumption (oxygen debt)", b:"Elevated oxygen use after exercise, to replenish creatine phosphate and oxygen stores and to clear metabolites.",
  why:"The reason you keep breathing hard after you stop running."},
 {id:"mus-c22", f:"Slow oxidative fibers", b:"Fatigue resistant, many mitochondria and capillaries, rich in myoglobin (red), used for endurance and posture.",
  why:"Myoglobin holds oxygen inside the fiber; more myoglobin means darker muscle and greater endurance."},
 {id:"mus-c23", f:"Fast glycolytic fibers", b:"Large, powerful, few mitochondria, rely on anaerobic glycolysis, fatigue quickly (white).",
  why:"Built for sprinting and lifting — maximum force for a short time."},
 {id:"mus-c24", f:"Origin and insertion", b:"Origin is the attachment to the less movable bone; insertion is the attachment to the more movable bone. The insertion moves toward the origin.",
  why:"Knowing which end moves tells you what the muscle actually does."},
 {id:"mus-c25", f:"Agonist, antagonist, synergist, fixator", b:"Agonist (prime mover) produces the action; antagonist opposes it; synergist assists; fixator stabilizes the origin.",
  why:"The antagonist must relax for smooth movement — coordinated by the nervous system, not the muscle."},
 {id:"mus-c26", f:"Cardiac and smooth muscle compared", b:"Cardiac: striated, involuntary, branched, intercalated discs, self-exciting. Smooth: not striated, involuntary, spindle-shaped, slow and sustained.",
  why:"Both use calcium and actin-myosin interaction — the regulation differs, not the fundamental machinery."}
],
qs:[
 {id:"mus-q1", o:2, v:"Curare, a plant toxin used on arrow tips, blocks acetylcholine receptors on the motor end plate.",
  s:"What is the effect, and why is it fatal?",
  a:[{t:"Flaccid paralysis — the muscle cannot be stimulated, including the diaphragm", ok:true,
      w:"Death is from respiratory failure, not from the toxin damaging tissue."},
     {t:"Sustained contraction, because ACh accumulates", w:"That is what blocking acetylcholinesterase would do, not blocking the receptor."},
     {t:"Nothing — calcium can still trigger contraction directly", w:"Calcium release requires the action potential that the blocked receptor prevents."},
     {t:"Only sensory loss", w:"The neuromuscular junction is motor."}],
  e:"Block the receptor: no signal, no contraction. Block the enzyme: signal never stops."},
 {id:"mus-q2", o:2, v:"A patient has antibodies destroying acetylcholine receptors at the neuromuscular junction. She reports drooping eyelids and weakness that worsens through the day.",
  s:"Which treatment target makes physiological sense?",
  a:[{t:"Inhibit acetylcholinesterase, so the ACh that is released lingers and has more chances to bind the remaining receptors", ok:true,
      w:"Exactly how myasthenia gravis is treated."},
     {t:"Block the remaining ACh receptors to reduce immune attack", w:"That would worsen the weakness."},
     {t:"Reduce calcium release from the sarcoplasmic reticulum", w:"Less calcium means weaker contraction."},
     {t:"Increase acetylcholinesterase activity", w:"That would clear ACh faster and worsen symptoms."}],
  e:"If you cannot add receptors, make each molecule of transmitter count for longer."},
 {id:"mus-q3", o:2, v:"A muscle fiber is examined during contraction.",
  s:"Which change will be observed?",
  a:[{t:"The I band and H zone narrow while the A band stays the same length", ok:true,
      w:"The A band is the thick filament length, which does not change — the filaments slide past each other."},
     {t:"All bands shorten proportionally", w:"That would mean the filaments themselves shorten, which they do not."},
     {t:"The A band narrows while the I band stays constant", w:"Exactly backward."},
     {t:"Only the Z discs shorten", w:"Z discs are boundaries, not contractile elements."}],
  e:"If the A band changed, the sliding filament theory would be wrong. It does not."},
 {id:"mus-q4", o:2, s:"Why does rigor mortis occur after death?",
  a:[{t:"ATP is no longer produced, and ATP is required for myosin to release actin", ok:true,
      w:"The cross-bridges stay attached because nothing can break them."},
     {t:"Calcium is pumped back into the SR without ATP", w:"That pump requires ATP too — which is why calcium stays out and the sites stay exposed."},
     {t:"Acetylcholine continues to be released after death", w:"Nerve activity ceases."},
     {t:"Muscle proteins denature immediately", w:"Denaturation is not the mechanism; it comes much later."}],
  e:"ATP is needed to let go, not to pull. Rigor mortis is that fact made visible."},
 {id:"mus-q5", o:1, s:"Place the steps of excitation-contraction coupling in order.",
  a:[{t:"Action potential down T tubule → SR releases calcium → calcium binds troponin → tropomyosin shifts → myosin binds actin", ok:true,
      w:"Electrical signal in, mechanical event out."},
     {t:"SR releases calcium → action potential down T tubule → myosin binds actin → troponin shifts", w:"The impulse must arrive before calcium is released."},
     {t:"Calcium binds tropomyosin → troponin shifts → myosin binds actin", w:"Calcium binds troponin, which then moves tropomyosin."},
     {t:"Myosin binds actin → calcium released → troponin shifts", w:"The binding sites are covered until calcium acts."}],
  e:"Calcium binds troponin. Tropomyosin is the cover that gets moved, not the sensor."},
 {id:"mus-q6", o:2, v:"Compare the motor units of the muscles that move the eye with those of the quadriceps.",
  s:"What difference would you expect, and why?",
  a:[{t:"Eye muscles have very few fibers per motor unit, allowing fine control; the quadriceps has hundreds, allowing power", ok:true,
      w:"Precision requires small increments of force; power does not."},
     {t:"Eye muscles have larger motor units, because they move constantly", w:"Frequency of use does not determine unit size; precision does."},
     {t:"Both have identical motor unit sizes", w:"Motor unit size varies enormously with function."},
     {t:"The quadriceps has smaller units because it is a larger muscle", w:"Larger, more powerful muscles have larger units."}],
  e:"Motor unit size is a direct readout of how finely a muscle must be controlled."},
 {id:"mus-q7", o:2, v:"A sprinter runs 100 meters in about 10 seconds. A marathoner runs for over two hours.",
  s:"Which energy systems dominate for each?",
  a:[{t:"Sprinter: creatine phosphate and anaerobic glycolysis. Marathoner: aerobic respiration.", ok:true,
      w:"Duration and intensity choose the system."},
     {t:"Sprinter: aerobic respiration. Marathoner: creatine phosphate.", w:"Exactly reversed; creatine phosphate lasts only seconds."},
     {t:"Both rely on anaerobic glycolysis throughout", w:"Anaerobic glycolysis cannot be sustained for hours."},
     {t:"Both rely on aerobic respiration throughout", w:"Aerobic respiration is too slow to supply peak sprint demand."}],
  e:"Seconds, a minute, or hours — that is the whole decision tree."},
 {id:"mus-q8", o:2, v:"A nerve agent irreversibly inhibits acetylcholinesterase.",
  s:"What happens at the neuromuscular junction?",
  a:[{t:"ACh stays in the cleft and repeatedly stimulates the fiber, causing sustained contraction and then paralysis", ok:true,
      w:"The muscle cannot relax; respiratory muscles eventually fail."},
     {t:"ACh is never released, causing flaccid paralysis", w:"Release is unaffected; breakdown is blocked."},
     {t:"Muscle fibers become unable to depolarize", w:"They depolarize excessively, not insufficiently."},
     {t:"Calcium is depleted from the SR with no other effect", w:"The primary lesion is in the cleft, not the SR."}],
  e:"Paralysis has two opposite causes: no signal at all, or a signal that never stops."},
 {id:"mus-q9", o:1, s:"Holding a heavy box motionless in front of you is which type of contraction?",
  a:[{t:"Isometric — tension develops but the muscle does not change length", ok:true,
      w:"No movement, yet substantial work and fatigue."},
     {t:"Isotonic concentric — the muscle shortens", w:"Nothing is moving."},
     {t:"Isotonic eccentric — the muscle lengthens under load", w:"Also requires a length change."},
     {t:"Not a contraction at all", w:"It is very much a contraction — it simply produces no motion."}],
  e:"Iso-metric: same measure, same length."},
 {id:"mus-q10", o:2, s:"Why must ATP be available for a muscle to relax, not just to contract?",
  a:[{t:"The SR calcium pump is active transport, and myosin detachment requires ATP binding", ok:true,
      w:"Both halves of relaxation cost energy."},
     {t:"Relaxation is entirely passive and requires no ATP", w:"Rigor mortis disproves this directly."},
     {t:"ATP is needed to break down acetylcholine", w:"Acetylcholinesterase does not require ATP."},
     {t:"ATP powers the power stroke, which reverses during relaxation", w:"The power stroke is not reversed; the cross-bridge detaches."}],
  e:"Calcium has to be pushed back uphill into the SR, and that is never free."},
 {id:"mus-q11", o:2, v:"A muscle is stimulated repeatedly at increasing frequency until the individual twitches merge into one smooth, sustained contraction.",
  s:"What is this called, and is it normal?",
  a:[{t:"Tetanus — and yes, it is how nearly all voluntary contraction actually works", ok:true,
      w:"Single twitches essentially never occur in ordinary movement."},
     {t:"Recruitment — and it occurs only in trained athletes", w:"Recruitment adds motor units; this question is about frequency at one unit."},
     {t:"Rigor — and it indicates ATP depletion", w:"Rigor is an inability to detach, not a frequency phenomenon."},
     {t:"Fatigue — and it precedes muscle failure", w:"Fatigue reduces force; tetanus increases and smooths it."}],
  e:"Two ways to increase force: fire faster (summation) or fire more units (recruitment)."},
 {id:"mus-q12", o:2, s:"A drug prevents calcium release from the sarcoplasmic reticulum. The nerve fires normally and ACh is released normally. What is the result?",
  a:[{t:"No contraction — troponin is never activated, so the binding sites stay covered", ok:true,
      w:"The electrical half of the chain is intact but the mechanical half never begins."},
     {t:"Sustained contraction, because the fiber remains depolarized", w:"Depolarization without calcium produces no cross-bridges."},
     {t:"Normal contraction, because calcium enters from outside the cell", w:"Skeletal muscle relies on SR calcium, not extracellular calcium, for contraction."},
     {t:"Contraction of only the fiber's surface", w:"Not the described mechanism."}],
  e:"Calcium is the switch. Every step before it is preparation; every step after depends on it."}
]});

"use strict";
var UNITS = (typeof window !== "undefined") ? window.__UNITS : global.__UNITS;

/* ---------------------------------------------------------- 10. NERVOUS */
UNITS.push({
id:"nrv", name:"Nervous Tissue & the Nervous System", short:"Nervous",
blurb:"Membrane potentials, the action potential, the synapse, and how the whole system is divided up. Heavy on mechanism.",
cards:[
 {id:"nrv-c1", f:"Three functions of the nervous system", b:"Sensory input (detect change), integration (interpret and decide), motor output (respond).",
  why:"Every neural pathway, from a reflex to a conscious decision, is some version of these three steps."},
 {id:"nrv-c2", f:"CNS vs. PNS", b:"Central nervous system = brain and spinal cord. Peripheral nervous system = all nerves outside them.",
  why:"The division is anatomical, and it determines which glial cells are present and whether regeneration is possible."},
 {id:"nrv-c3", f:"Divisions of the PNS", b:"Sensory (afferent) carries information in; motor (efferent) carries commands out. Motor splits into somatic (voluntary, skeletal muscle) and autonomic (involuntary).",
  why:"Afferent arrives, efferent exits. The autonomic division then splits again into sympathetic and parasympathetic."},
 {id:"nrv-c4", f:"Parts of a neuron", b:"Dendrites receive, the cell body (soma) integrates, the axon hillock triggers, and the axon conducts to the axon terminals.",
  why:"The axon hillock is the decision point: it is where enough summed input either reaches threshold or does not."},
 {id:"nrv-c5", f:"Astrocytes", b:"The most abundant CNS glia; anchor neurons to capillaries, help form the blood-brain barrier, and regulate the chemical environment.",
  why:"They control what reaches neurons, which is why many drugs cannot get into the brain."},
 {id:"nrv-c6", f:"Microglia and ependymal cells", b:"Microglia are the CNS's immune cells, removing debris and pathogens. Ependymal cells line the ventricles and circulate cerebrospinal fluid.",
  why:"The brain has no lymphatic drainage of the usual sort, so it keeps its own immune cells resident."},
 {id:"nrv-c7", f:"Oligodendrocytes vs. Schwann cells", b:"Oligodendrocytes myelinate axons in the CNS, each wrapping many axons. Schwann cells myelinate in the PNS, one segment per cell.",
  why:"Schwann cells also guide regeneration, which is why a peripheral nerve can recover but a spinal cord injury usually cannot."},
 {id:"nrv-c8", f:"Myelin sheath and nodes of Ranvier", b:"A fatty insulating wrap around an axon, interrupted at intervals by bare gaps called nodes of Ranvier.",
  why:"Myelin insulates; the nodes are where the membrane can actually depolarize. Both are needed."},
 {id:"nrv-c9", f:"Saltatory conduction", b:"The impulse jumps from node to node rather than moving continuously, greatly increasing conduction speed.",
  why:"“Saltatory” means leaping. A myelinated axon can conduct many times faster than an unmyelinated one of the same diameter."},
 {id:"nrv-c10", f:"Multiple sclerosis", b:"An autoimmune attack on CNS myelin; conduction slows or fails, producing variable weakness, numbness and visual changes.",
  why:"The axon is often intact — it is the insulation that is lost. That is why symptoms can come and go."},
 {id:"nrv-c11", f:"Resting membrane potential", b:"About −70 mV inside relative to outside, maintained by the sodium-potassium pump, greater membrane permeability to K⁺, and large negatively charged proteins trapped inside.",
  why:"The cell is a charged battery at rest. Every signal it sends is a controlled, momentary discharge."},
 {id:"nrv-c12", f:"Graded potential", b:"A small, local change in membrane potential whose size varies with stimulus strength and which fades with distance.",
  why:"Graded potentials do the adding up; only if they reach threshold at the axon hillock is an action potential fired."},
 {id:"nrv-c13", f:"Threshold and all-or-none", b:"At roughly −55 mV, voltage-gated sodium channels open and an action potential fires at full strength or not at all.",
  why:"A stronger stimulus does not make a bigger impulse — it makes more impulses per second. That is how intensity is coded."},
 {id:"nrv-c14", f:"Depolarization", b:"Voltage-gated Na⁺ channels open and sodium rushes in, driving the inside sharply positive (toward about +30 mV).",
  why:"Sodium is far more concentrated outside and the inside is negative — both gradients push it in, so no ATP is needed for this step."},
 {id:"nrv-c15", f:"Repolarization", b:"Na⁺ channels inactivate and voltage-gated K⁺ channels open; potassium leaves and the inside returns toward negative.",
  why:"Potassium channels are slower to open and slower to close — which is why the membrane briefly overshoots."},
 {id:"nrv-c16", f:"Hyperpolarization", b:"A brief dip below the resting potential because potassium channels stay open a little too long.",
  why:"It contributes to the relative refractory period, making the neuron temporarily harder to fire."},
 {id:"nrv-c17", f:"Absolute vs. relative refractory period", b:"Absolute: no stimulus of any strength can fire another impulse, because Na⁺ channels are inactivated. Relative: only a stronger-than-normal stimulus can.",
  why:"The absolute refractory period is why impulses travel in one direction only and why firing frequency has a ceiling."},
 {id:"nrv-c18", f:"What determines conduction speed", b:"Axon diameter (wider is faster) and myelination (myelinated is much faster).",
  why:"Both reduce resistance to current flow along the axon. Pain fibers are thin and unmyelinated; that is why aching pain arrives late."},
 {id:"nrv-c19", f:"Synaptic transmission", b:"The impulse reaches the terminal → voltage-gated Ca²⁺ channels open → calcium triggers vesicle fusion → neurotransmitter crosses the cleft → binds receptors on the postsynaptic membrane.",
  why:"Calcium is the trigger for release here exactly as it is the trigger for contraction in muscle."},
 {id:"nrv-c20", f:"EPSP and IPSP", b:"An excitatory postsynaptic potential depolarizes and moves the cell toward threshold; an inhibitory one hyperpolarizes and moves it away.",
  why:"A neuron is continuously adding up thousands of both. The output is the net result, not any single input."},
 {id:"nrv-c21", f:"Temporal and spatial summation", b:"Temporal: one synapse fires rapidly in succession. Spatial: many synapses fire at once. Both add graded potentials toward threshold.",
  why:"Summation is how a neuron makes a decision — it is arithmetic, performed on the membrane."},
 {id:"nrv-c22", f:"Key neurotransmitters", b:"Acetylcholine (skeletal NMJ, parasympathetic), norepinephrine (sympathetic, alertness), dopamine (reward, movement), serotonin (mood, sleep), GABA (main inhibitory), glutamate (main excitatory).",
  why:"Whether a transmitter excites or inhibits depends on the receptor, not only on the molecule."},
 {id:"nrv-c23", f:"Reflex arc", b:"Receptor → sensory neuron → integration center in the CNS → motor neuron → effector.",
  why:"A reflex bypasses the brain for speed. You pull your hand back before you consciously feel the burn."},
 {id:"nrv-c24", f:"The four major brain regions", b:"Cerebrum (conscious thought, sensation, voluntary movement), diencephalon (thalamus and hypothalamus), brainstem (midbrain, pons, medulla), cerebellum (coordination and balance).",
  why:"The medulla holds the cardiac, vasomotor and respiratory centers — damage there is immediately fatal."},
 {id:"nrv-c25", f:"Hypothalamus", b:"The main control center for homeostasis: temperature, hunger, thirst, sleep cycles, emotion, and control of the pituitary.",
  why:"Small structure, enormous reach — it is the bridge between the nervous and endocrine systems."},
 {id:"nrv-c26", f:"Cerebellum", b:"Coordinates timing, balance and smoothness of movement; it does not initiate movement.",
  why:"Damage produces clumsy, poorly timed movement with normal strength — which is how it is distinguished from motor cortex injury."},
 {id:"nrv-c27", f:"Meninges and cerebrospinal fluid", b:"Three membranes — dura, arachnoid, pia mater — with CSF circulating in the subarachnoid space and the ventricles.",
  why:"CSF lets the brain float, dramatically reducing its effective weight and cushioning it against impact."},
 {id:"nrv-c28", f:"Sympathetic vs. parasympathetic", b:"Sympathetic (thoracolumbar) prepares for exertion: heart rate up, airways open, pupils dilate, digestion slows. Parasympathetic (craniosacral) conserves: heart rate down, digestion active.",
  why:"Fight-or-flight and rest-and-digest. Most organs receive both and are held at a working balance."}
],
qs:[
 {id:"nrv-q1", o:2, v:"A local anesthetic is injected before a dental procedure. It blocks voltage-gated sodium channels in nearby axons.",
  s:"Why does this abolish sensation?",
  a:[{t:"Without sodium entry the membrane cannot depolarize to threshold, so no action potential can form or travel", ok:true,
      w:"Blocking the first step blocks everything downstream."},
     {t:"It prevents the sodium-potassium pump from working, so the resting potential collapses", w:"The pump is not the target; voltage-gated channels are."},
     {t:"It blocks potassium channels, so the neuron cannot repolarize", w:"That would prolong impulses rather than prevent them."},
     {t:"It destroys the myelin sheath", w:"The effect is reversible and does not involve myelin."}],
  e:"Sodium entry is the action potential's ignition. No ignition, no signal."},
 {id:"nrv-q2", o:2, v:"A patient with multiple sclerosis has patchy loss of myelin in the CNS, but the underlying axons are largely intact.",
  s:"Why does this cause weakness and numbness?",
  a:[{t:"Without myelin the impulse cannot leap between nodes, so conduction slows dramatically or fails", ok:true,
      w:"Signals arrive late, distorted, or not at all."},
     {t:"The axons can no longer produce neurotransmitter", w:"Transmitter synthesis is not the lesion."},
     {t:"The sodium-potassium pump stops working", w:"The pump is unaffected."},
     {t:"Sensory neurons are converted into motor neurons", w:"Not a real phenomenon."}],
  e:"Myelin is insulation. Strip it and current leaks away before reaching the next node."},
 {id:"nrv-q3", o:2, v:"A patient's blood potassium rises well above normal.",
  s:"What happens to the resting membrane potential of excitable cells, and why is this dangerous?",
  a:[{t:"The cell becomes less negative inside — closer to threshold — which destabilizes cardiac rhythm", ok:true,
      w:"Raising extracellular K⁺ reduces potassium's outward gradient, so less positive charge leaves."},
     {t:"The cell becomes far more negative, making it impossible to fire", w:"That would be caused by low extracellular potassium."},
     {t:"The resting potential is unaffected, because potassium plays no role in it", w:"Potassium permeability is the main determinant of the resting potential."},
     {t:"Sodium leaves the cell, raising the threshold", w:"Not the mechanism."}],
  e:"Potassium sets the resting potential. This is why potassium is monitored so carefully in hospital patients."},
 {id:"nrv-q4", o:1, s:"Place the events of an action potential in order.",
  a:[{t:"Threshold reached → Na⁺ channels open and Na⁺ enters → Na⁺ channels inactivate and K⁺ channels open → K⁺ exits → brief hyperpolarization", ok:true,
      w:"Sodium in, potassium out, slight overshoot."},
     {t:"K⁺ enters → Na⁺ exits → resting potential restored", w:"The directions are reversed for both ions."},
     {t:"Na⁺ exits → K⁺ enters → depolarization", w:"Sodium moves in during depolarization."},
     {t:"Both Na⁺ and K⁺ enter simultaneously → the cell depolarizes", w:"Potassium leaves; that is what repolarizes the cell."}],
  e:"Sodium in makes it positive; potassium out makes it negative again."},
 {id:"nrv-q5", o:2, s:"Why does the absolute refractory period ensure that an impulse travels in only one direction?",
  a:[{t:"The membrane just behind the impulse cannot fire again, so the signal can propagate only forward", ok:true,
      w:"Inactivated sodium channels create a moving zone of unexcitable membrane behind the impulse."},
     {t:"The axon is physically shaped to conduct one way", w:"Membrane state, not shape, enforces direction."},
     {t:"Myelin allows conduction in only one direction", w:"Myelin speeds conduction but does not set its direction."},
     {t:"Neurotransmitter at the synapse pulls the impulse forward", w:"Direction is established along the axon, before the synapse."}],
  e:"The refractory period is not just a limit on firing rate — it is what makes signals go somewhere."},
 {id:"nrv-q6", o:2, v:"A neuron receives 40 excitatory inputs and 38 inhibitory inputs in the same brief interval.",
  s:"What determines whether it fires?",
  a:[{t:"The net sum of EPSPs and IPSPs at the axon hillock, compared with threshold", ok:true,
      w:"The neuron performs continuous arithmetic and acts on the total."},
     {t:"Whichever type of input arrived first", w:"Order alone does not decide; summation does."},
     {t:"Excitatory inputs always win when they outnumber inhibitory ones", w:"Inputs differ in size and location, so counting them is not enough."},
     {t:"It always fires if it receives any excitatory input", w:"That would make inhibition meaningless."}],
  e:"A neuron is not a relay. It is a summing device with a threshold."},
 {id:"nrv-q7", o:2, v:"You touch a hot pan and your hand withdraws before you consciously register the pain.",
  s:"Why is the movement faster than the sensation?",
  a:[{t:"The reflex arc is completed in the spinal cord, while the pain signal must travel on to the brain", ok:true,
      w:"Fewer synapses and a shorter path mean a faster response."},
     {t:"Pain signals travel more slowly because they are inhibitory", w:"Pain is not inhibitory; the difference is path length and fiber type."},
     {t:"The brain suppresses pain during emergencies", w:"Some modulation exists, but the described timing is due to the reflex arc."},
     {t:"Motor neurons are myelinated and sensory neurons are not", w:"Both include myelinated fibers; the reflex path is simply shorter."}],
  e:"The spinal cord is allowed to act without asking permission. That is what a reflex is."},
 {id:"nrv-q8", o:1, s:"Which glial cell forms myelin in the peripheral nervous system?",
  a:[{t:"Schwann cell", ok:true, w:"One cell forms one myelin segment, and also guides regeneration after injury."},
     {t:"Oligodendrocyte", w:"Forms myelin in the CNS, wrapping several axons at once."},
     {t:"Astrocyte", w:"Supports neurons and helps form the blood-brain barrier."},
     {t:"Microglia", w:"The CNS's immune cells."}],
  e:"Schwann in the periphery, oligodendrocyte in the center. That difference explains why one regenerates and the other does not."},
 {id:"nrv-q9", o:2, v:"A drug enhances the effect of GABA at its receptor.",
  s:"What clinical effect would you predict?",
  a:[{t:"Sedation and reduced anxiety, because GABA is the main inhibitory transmitter in the CNS", ok:true,
      w:"Exactly how benzodiazepines and many sedatives work."},
     {t:"Increased alertness and muscle activity", w:"That would follow from enhancing an excitatory transmitter."},
     {t:"Seizures, from excessive neuronal firing", w:"Enhancing inhibition raises the seizure threshold rather than lowering it."},
     {t:"No CNS effect, because GABA acts only at the neuromuscular junction", w:"The skeletal NMJ uses acetylcholine; GABA is central."}],
  e:"Ask first whether the transmitter is excitatory or inhibitory. The rest usually follows."},
 {id:"nrv-q10", o:2, v:"A patient has normal strength but moves clumsily, overshooting when reaching for objects and swaying when standing still.",
  s:"Which brain region is most likely affected?",
  a:[{t:"Cerebellum — it coordinates timing and balance without initiating movement", ok:true,
      w:"Preserved strength with poor coordination is the signature."},
     {t:"Primary motor cortex — it initiates voluntary movement", w:"Damage there causes weakness or paralysis, not just clumsiness."},
     {t:"Medulla oblongata — it controls heart rate and breathing", w:"Damage there is immediately life-threatening."},
     {t:"Hypothalamus — it controls homeostasis", w:"Would disturb temperature, appetite or hormones, not coordination."}],
  e:"Strength intact, coordination lost — look to the cerebellum."},
 {id:"nrv-q11", o:1, s:"How does the nervous system code a stronger stimulus, given that action potentials are all-or-none?",
  a:[{t:"By firing more frequently, and by recruiting more neurons", ok:true,
      w:"Frequency and population coding, since amplitude is fixed."},
     {t:"By producing larger action potentials", w:"All-or-none means amplitude does not vary."},
     {t:"By conducting the impulse faster", w:"Speed is a property of the fiber, not of stimulus strength."},
     {t:"By releasing a different neurotransmitter", w:"Transmitter identity does not encode intensity."}],
  e:"Fixed size, variable rate. Intensity is written in the timing."},

UNITS.push({
id:"sen", name:"The Special Senses", short:"Senses",
blurb:"Vision, hearing and balance, taste and smell — each one a transducer turning a physical signal into an action potential.",
cards:[
 {id:"sen-c1", f:"Sensory transduction", b:"Converting a stimulus — light, sound, chemical, pressure — into an electrical signal the nervous system can carry.",
  why:"Every sense organ is a transducer. The nervous system only ever speaks one language."},
 {id:"sen-c2", f:"Three layers (tunics) of the eye", b:"Fibrous (sclera and cornea), vascular (choroid, ciliary body, iris), inner (retina).",
  why:"Outer protects and refracts, middle nourishes and controls light, inner detects it."},
 {id:"sen-c3", f:"Cornea", b:"The transparent anterior part of the fibrous layer; it does most of the eye's light bending.",
  why:"Avascular and therefore transplantable with little rejection risk — and the reason corneal reshaping corrects vision."},
 {id:"sen-c4", f:"Iris and pupil", b:"The iris is the pigmented muscular ring; the pupil is the opening in its center whose size it controls.",
  why:"Circular muscle constricts in bright light, radial muscle dilates in dim light — a smooth muscle aperture."},
 {id:"sen-c5", f:"Lens and accommodation", b:"The lens fine-tunes focus. Ciliary muscle contraction slackens the suspensory ligaments and lets the lens round up for near vision.",
  why:"Counterintuitive: the muscle contracts to make the lens fatter. The lens stiffens with age, which is presbyopia."},
 {id:"sen-c6", f:"Rods", b:"Photoreceptors for dim light and peripheral vision; highly sensitive, no color, low acuity. Concentrated away from the center of the retina.",
  why:"Why you see a faint star better by looking slightly to the side of it."},
 {id:"sen-c7", f:"Cones", b:"Photoreceptors for bright light, color and sharp detail; concentrated in the fovea centralis.",
  why:"Three types tuned to different wavelengths; color blindness is usually a missing or altered cone type."},
 {id:"sen-c8", f:"Fovea centralis and optic disc", b:"The fovea is packed with cones and gives the sharpest vision. The optic disc is where the optic nerve exits and has no photoreceptors — the blind spot.",
  why:"You never notice the blind spot because the brain fills it in from surrounding information."},
 {id:"sen-c9", f:"Myopia and hyperopia", b:"Myopia (nearsighted): the image focuses in front of the retina, often because the eyeball is too long. Hyperopia (farsighted): it focuses behind the retina.",
  why:"Concave lenses correct myopia; convex lenses correct hyperopia."},
 {id:"sen-c10", f:"Glaucoma", b:"Raised pressure inside the eye from impaired drainage of aqueous humor, damaging the optic nerve.",
  why:"Peripheral vision is lost first and painlessly, which is why screening matters more than symptoms."},
 {id:"sen-c11", f:"Three regions of the ear", b:"External (auricle and canal to the eardrum), middle (ossicles in an air-filled cavity), inner (cochlea and vestibular apparatus in fluid).",
  why:"Sound changes medium twice — air to bone to fluid — and the middle ear exists to make that transfer efficient."},
 {id:"sen-c12", f:"The auditory ossicles", b:"Malleus, incus and stapes — they transmit and amplify eardrum vibration to the oval window.",
  why:"They concentrate force from the large eardrum onto the small oval window, overcoming the resistance of fluid."},
 {id:"sen-c13", f:"Cochlea and the organ of Corti", b:"The coiled, fluid-filled inner ear structure containing hair cells that bend against the tectorial membrane and generate impulses.",
  why:"Bending stereocilia opens ion channels — mechanical movement becomes an electrical signal."},
 {id:"sen-c14", f:"How pitch is detected", b:"Different regions of the basilar membrane vibrate maximally to different frequencies — high near the base, low near the apex.",
  why:"Pitch is encoded by location, not by rate. Noise damage typically destroys the high-frequency base first."},
 {id:"sen-c15", f:"Vestibular apparatus", b:"Semicircular canals detect rotational acceleration; the utricle and saccule detect linear acceleration and head position relative to gravity.",
  why:"Three canals in three planes, so any direction of rotation stimulates some combination of them."},
 {id:"sen-c16", f:"Auditory (Eustachian) tube", b:"Connects the middle ear to the pharynx and equalizes pressure across the eardrum.",
  why:"Short and horizontal in children, which is why ear infections are so much more common at that age."},
 {id:"sen-c17", f:"Taste and smell are chemical senses", b:"Both respond to dissolved molecules binding receptors. The five basic tastes are sweet, sour, salty, bitter and umami.",
  why:"Most of what people call flavor is actually smell, which is why food tastes flat with a blocked nose."},
 {id:"sen-c18", f:"Olfactory pathway", b:"Olfactory receptors in the nasal roof send axons through the cribriform plate to the olfactory bulb, and on to the cortex and limbic system.",
  why:"It is the only sense that reaches the cortex without first passing through the thalamus — which is why smell triggers memory and emotion so directly."}

qs:[

  s:"What explains this?",
  a:[{t:"The fovea holds only cones, which need bright light; rods in the peripheral retina are far more sensitive", ok:true,
      w:"Looking slightly away places the image on rod-rich retina."},
     {t:"The blind spot is at the center of vision", w:"The optic disc is off to the side, not at the visual center."},
     {t:"The lens cannot accommodate for distant objects", w:"Distant objects need the least accommodation."},
     {t:"Cones respond only to moving stimuli", w:"Cones respond to detail and color, not specifically to motion."}],

 {id:"sen-q2", o:2, v:"A patient gradually loses peripheral vision without pain. Pressure inside the eye is elevated.",
  s:"What is the diagnosis, and why is early detection so important?",
  a:[{t:"Glaucoma — the damage to the optic nerve is irreversible, and it progresses silently", ok:true,
      w:"By the time central vision is affected, a great deal has already been lost permanently."},
     {t:"Cataract — the lens has clouded", w:"A cataract blurs vision overall and does not raise pressure."},
     {t:"Myopia — the eyeball has elongated", w:"A refractive error, correctable and not pressure related."},
     {t:"Detached retina — the retina has separated", w:"Usually sudden, with flashes and floaters, and not defined by raised pressure."}],

  s:"Where in the cochlea is the damage, and why there?",
  a:[{t:"At the base of the basilar membrane, which responds to high frequencies and takes the brunt of loud sound", ok:true,
      w:"Pitch is mapped along the membrane, so frequency-specific loss points to a specific location."},
     {t:"At the apex, which responds to high frequencies", w:"The apex handles low frequencies."},
     {t:"In the ossicles, which transmit only high frequencies", w:"The ossicles transmit all frequencies."},
     {t:"In the semicircular canals", w:"Those handle balance, not hearing."}],
  e:"Because pitch is coded by place, the pattern of hearing loss tells you where the damage is."},
 {id:"sen-q4", o:1, s:"Which structure contains the greatest concentration of cones?",
  a:[{t:"Fovea centralis", ok:true, w:"Which is why you must look directly at something to see it sharply."},
     {t:"Optic disc", w:"It has no photoreceptors at all — the blind spot."},
     {t:"Peripheral retina", w:"Dominated by rods."},
     {t:"Choroid", w:"The vascular layer; it nourishes the retina but does not detect light."}],
  e:"Fovea = detail. Optic disc = blind."},
 {id:"sen-q5", o:2, v:"A child has repeated middle ear infections. The pediatrician mentions the shape of the auditory tube.",
  s:"Why are children more susceptible?",
  a:[{t:"Their auditory tubes are shorter and more horizontal, so organisms pass more easily from the throat to the middle ear", ok:true,

     {t:"Their eardrums are thinner and rupture more easily", w:"Not the standard explanation for frequency of infection."},
     {t:"Their ossicles have not yet ossified", w:"The ossicles are fully formed at birth."},
     {t:"Their cochlea is not fully coiled", w:"Cochlear development is not the issue."}],
  e:"An anatomical detail with a direct clinical consequence — a favorite exam pattern."},
 {id:"sen-q6", o:2, s:"Why does food seem tasteless when you have a head cold?",
  a:[{t:"Most of what is perceived as flavor comes from olfaction, which is blocked by nasal congestion", ok:true,
      w:"The five basic tastes remain, but the nuance is gone."},
     {t:"Taste buds are destroyed by the virus", w:"Taste buds are not destroyed by a cold."},
     {t:"The tongue swells and covers the taste pores", w:"Not the mechanism."},
     {t:"Saliva production stops entirely", w:"Some dryness may occur, but the dominant factor is loss of smell."}],
  e:"Taste is five categories. Flavor is mostly smell."},
 {id:"sen-q7", o:2, v:"A dancer spins repeatedly and then stops abruptly, feeling as though the room continues to rotate.",
  s:"Which structure explains the sensation?",
  a:[{t:"The semicircular canals — the fluid inside keeps moving briefly after the head stops", ok:true,
      w:"Hair cells continue to be bent, signaling rotation that is no longer occurring."},
     {t:"The cochlea — sound waves persist in the fluid", w:"The cochlea handles hearing, not rotation."},
     {t:"The utricle — it detects rotation", w:"The utricle detects linear acceleration and head tilt."},
     {t:"The auditory tube — pressure has not equalized", w:"Pressure equalization does not produce a spinning sensation."}],
  e:"Inertia in the fluid is why the sensation outlasts the motion."},
 {id:"sen-q8", o:2, s:"Why does a particular smell so often trigger a vivid memory or emotion?",
  a:[{t:"Olfactory pathways reach the cortex and limbic system without first relaying through the thalamus", ok:true,

     {t:"Smell receptors regenerate faster than other receptors", w:"True, but unrelated to memory."},
     {t:"Odor molecules enter the bloodstream and reach the brain directly", w:"Not the mechanism of olfaction."},
     {t:"The olfactory nerve is the longest cranial nerve", w:"It is in fact one of the shortest."}],
  e:"Anatomy explains the experience: fewer stops between the nose and the memory."}

  return pick(out, Math.min(n || 8, out.length));
}

/* ================================================================ diagrams & plates */
var PLATES = G.__PLATES || [];
function diagramsFor(sel){ return sel==="all" ? DIAGRAMS : DIAGRAMS.filter(function(d){ return d.unit===sel; }); }
function platesFor(sel){ return sel==="all" ? PLATES : PLATES.filter(function(p){ return p.unit===sel; }); }
/* "Name this plate": the picture, four names. Distractors come from every plate
   so a unit with only one plate still gets a real question. */
function plateQuiz(list){
  return shuffle(list).map(function(p){
    var others = pick(PLATES.filter(function(x){ return x.id !== p.id; }), 3);
    return {id:p.id, file:p.file, name:p.name, caption:p.caption,
            opts:shuffle([{t:p.name, ok:true}].concat(others.map(function(x){ return {t:x.name, ok:false}; })))};
  });
}
/* A numbered plate: "what is structure 14?" with the other numbers as wrong answers. */
function plateKeyQuiz(p){
  if(!p.key) return [];
  return shuffle(p.key).map(function(k){
    var others = pick(p.key.filter(function(x){ return x.label !== k.label; }), 3);
    return {n:k.n, label:k.label, note:k.note || "",
            opts:shuffle([{t:k.label, ok:true}].concat(others.map(function(x){ return {t:x.label, ok:false}; })))};
  });
}
function diagramQuiz(dg){
  return shuffle(dg.pins).map(function(p){
    var others = pick(dg.pins.filter(function(x){ return x.n !== p.n; }), 3);
    return {n:p.n, label:p.label, note:p.note,
            opts:shuffle([{t:p.label, ok:true}].concat(others.map(function(x){ return {t:x.label, ok:false}; })))};
  });
}

  function wire(id, attr, fn){

function startExam(missedIds){

function renderDots(){
  var d = $("#dots"); if(!d) return;
  d.innerHTML = "";
  exam.qs.forEach(function(q, i){
    var s = document.createElement("i");
    if(q.got === true) s.className = "ok"; else if(q.got === false) s.className = "no"; else if(i === exam.i) s.className = "on";

var timerId = null;
function tick(){
  if(timerId) clearInterval(timerId);

    var el = $("#timer"); if(!el || !exam){ clearInterval(timerId); return; }
    var s = Math.floor((Date.now() - exam.t0)/1000);
    el.textContent = Math.floor(s/60) + ":" + (s%60 < 10 ? "0" : "") + (s%60);
  }, 1000);
}
function answer(idx){
  if(exam.answered) return;
  exam.answered = true;
  var q = exam.qs[exam.i], chosen = q.opts[idx], right = chosen.ok;
  q.got = right;
  var rec = DB.qs[q.id] || {seen:0, right:0, sure:0, sureRight:0};
  rec.seen++; if(right) rec.right++;
  if(exam.sure !== null){ rec.sure++; if(right) rec.sureRight++; }
  DB.qs[q.id] = rec; save();
  exam.log.push({id:q.id, unit:q.unitName, o:q.o, right:right, sure:exam.sure});
  if(right) exam.score++; else exam.missed.push(q);
  $$("#opts .opt").forEach(function(b, i){
    b.disabled = true;
    var o = q.opts[i];
    if(o.ok) b.classList.add("correct");
    if(i === idx && !right) b.classList.add("wrong");
    if(o.w && (o.ok || i === idx)) b.innerHTML += '<span class="why">'+o.w+'</span>';
  });

    (right ? "Correct" : "Not this one") + '</span>'+q.e+'</div>';

function renderResults(){

  exam.log.forEach(function(l){
    byUnit[l.unit] = byUnit[l.unit] || {n:0, r:0};
    byUnit[l.unit].n++; if(l.right) byUnit[l.unit].r++;

  });
  var verdict = p===100 ? "Perfect. Push into a harder mix — all units, application only."
    : p>=85 ? "Strong. The misses below are the whole job now."

    : p>=50 ? "About half. Go back to the flashcards for this unit before testing again."

  var C = 2*Math.PI*58;
  var html =
    '<div class="card res">'+
      '<div class="scorewrap">'+
        '<div class="ring"><svg width="132" height="132"><circle cx="66" cy="66" r="58" fill="none" stroke="var(--surface-3)" stroke-width="11"/>'+
          '<circle cx="66" cy="66" r="58" fill="none" stroke="var(--accent)" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-p/100))+'"/></svg>'+
          '<div class="val">'+p+'%<small>'+exam.score+' of '+n+'</small></div></div>'+

      '</div>'+

        (pct(sureR,sureN) >= 90 ? 'Your confidence is trustworthy — trust it on exam day.' : 'Being confidently wrong is the most expensive kind of gap, because you will not study it. Look hard at those misses.')+'</div>' : "")+
      (exam.missed.length ? '<div class="misses"><h3 style="font-size:14px;margin-bottom:4px">What you missed</h3>'+

function brow(name, r, n){

/* ================================================================ 3. MATCH */
var match = null, matchChoice = DB.prefs.matchSet || null;
function newMatch(){
  var sets = matchSetsFor(sel);
  if(matchChoice !== "defs" && !sets.filter(function(s){ return s.id === matchChoice; }).length){
    matchChoice = sets.length ? sets[0].id : "defs";
  }
  var s = matchChoice === "defs" ? null : setById(matchChoice);
  var items = s ? matchFromSet(s.id, 8) : matchSet(sel, 8);
  match = {items:items, sel:null, done:0, miss:0, left:s ? s.left : "Term", right:s ? s.right : "Definition"};
  DB.prefs.matchSet = matchChoice; save();
  renderMatch();
}
function renderMatch(){
  var root = $("#matchRoot");
  if(!match) newMatch();
  var m = match, sets = matchSetsFor(sel);
  var picker = '<select id="mSet" aria-label="What to match">'+
    sets.map(function(s){ return '<option value="'+s.id+'"'+(s.id===matchChoice?' selected':'')+'>'+esc(s.name)+'</option>'; }).join("")+
    '<option value="defs"'+(matchChoice==="defs"?' selected':'')+'>Terms and definitions from the cards</option></select>';
  if(!m.items.length){
    root.innerHTML = '<div class="studyhead">'+picker+'</div><div class="empty">Nothing to match here. Pick another set or unit.</div>';
    $("#mSet").addEventListener("change", function(){ matchChoice = this.value; newMatch(); });
    return;
  }
  root.innerHTML =
    '<div class="studyhead">'+picker+
      '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">'+
        '<div class="chips"><span>Matched <b>'+m.done+' of '+m.items.length+'</b></span><span>Misses <b>'+m.miss+'</b></span></div>'+
        '<button class="btn sm" id="mNew">New round</button>'+
      '</div>'+
    '</div>'+
    (m.done === m.items.length ? '<div class="banner">Round complete — '+(m.miss===0?'a perfect run.':m.miss+(m.miss===1?' miss.':' misses.'))+'</div>' : '')+
    '<div class="mgrid">'+
      '<div class="mcol"><h3>'+esc(m.left)+'</h3><div class="tiles" id="mL"></div></div>'+
      '<div class="mcol"><h3>'+esc(m.right)+'</h3><div class="tiles" id="mR"></div></div>'+
    '</div>';
  $("#mSet").addEventListener("change", function(){ matchChoice = this.value; newMatch(); });
  $("#mNew").addEventListener("click", newMatch);
  var L = $("#mL"), R = $("#mR");
  shuffle(m.items).forEach(function(it){ tile(L, it, "L", it.term, "tile term"); });
  shuffle(m.items).forEach(function(it){ tile(R, it, "R", it.def, "tile"); });
  function tile(parent, it, side, text, cls){
    var b = document.createElement("button");
    b.type = "button"; b.className = cls + (m.solved && m.solved[it.id] ? " done" : "");
    b.innerHTML = text;
    b.addEventListener("click", function(){ clickTile(side, it, b); });
    parent.appendChild(b);
  }
}
function clickTile(side, it, node){
  var m = match;
  if(node.classList.contains("done")) return;
  if(!m.sel){ m.sel = {side:side, it:it, node:node}; node.classList.add("sel"); return; }
  if(m.sel.side === side){ m.sel.node.classList.remove("sel"); m.sel = {side:side, it:it, node:node}; node.classList.add("sel"); return; }
  var a = m.sel; m.sel = null; a.node.classList.remove("sel");
  if(a.it.id === it.id){
    a.node.classList.add("done"); node.classList.add("done");
    m.solved = m.solved || {}; m.solved[it.id] = 1; m.done++;
    var head = $("#matchRoot .chips");
    if(head) head.innerHTML = '<span>Matched <b>'+m.done+' of '+m.items.length+'</b></span><span>Misses <b>'+m.miss+'</b></span>';
    if(m.done === m.items.length) renderMatch();
  } else {
    m.miss++;
    [a.node, node].forEach(function(x){ x.classList.add("bad"); setTimeout(function(){ x.classList.remove("bad"); }, 380); });
    var h = $("#matchRoot .chips");
    if(h) h.innerHTML = '<span>Matched <b>'+m.done+' of '+m.items.length+'</b></span><span>Misses <b>'+m.miss+'</b></span>';
  }
}

/* ================================================================ 4. DIAGRAMS */
var dg = {view:"draw", id:null, mode:"reveal", shown:{}, quiz:null, qi:0, score:0, pq:null, pqi:0, pscore:0};
function viewToggle(){
  return '<div class="seg" id="dgView">'+
    '<button type="button" data-v="draw" aria-pressed="'+(dg.view==="draw")+'">Drawings</button>'+
    '<button type="button" data-v="plates" aria-pressed="'+(dg.view==="plates")+'">Plates</button>'+
  '</div>';
}
function wireView(){
  $("#dgView").addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("button[data-v]") : null;
    if(!b) return;
    dg.view = b.getAttribute("data-v"); dg.pq = null; dg.kq = null; dg.quiz = null; dg.shown = {}; renderDiagrams();
  });
}
function renderDiagrams(){
  var root = $("#dgRoot");
  var list = diagramsFor(sel), plates = platesFor(sel);
  if(dg.view === "draw" && !list.length && plates.length) dg.view = "plates";
  if(dg.view === "plates"){ renderPlates(plates); return; }
  if(!list.length){
    root.innerHTML = '<div class="studyhead">'+viewToggle()+'</div>'+
      '<div class="empty">No drawing for this unit yet. Switch to <b>All units</b> to see the '+DIAGRAMS.length+' available.</div>';
    wireView();
    return;
  }
  if(!dg.id || !list.filter(function(d){ return d.id===dg.id; }).length){ dg.id = list[0].id; dg.shown = {}; dg.quiz = null; }
  var d = DIAGRAMS.filter(function(x){ return x.id===dg.id; })[0];
  root.innerHTML =
    '<div class="studyhead">'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">'+viewToggle()+
      '<select id="dgSel" aria-label="Choose a diagram">'+list.map(function(x){ return '<option value="'+x.id+'"'+(x.id===dg.id?' selected':'')+'>'+esc(x.name)+'</option>'; }).join("")+'</select></div>'+
      '<div class="seg" id="dgMode">'+
        '<button type="button" data-m="reveal" aria-pressed="'+(dg.mode==="reveal")+'">Reveal</button>'+
        '<button type="button" data-m="quiz" aria-pressed="'+(dg.mode==="quiz")+'">Quiz me</button>'+
      '</div>'+
    '</div>'+
    '<p class="hintbar" style="margin:0 0 14px">'+esc(d.blurb)+'</p>'+
    '<div class="dgstage"><div class="dgart" id="dgArt" style="max-width:'+d.maxw+'px">'+
      '<svg class="art" viewBox="0 0 '+d.w+' '+d.h+'" role="img" aria-label="'+esc(d.name)+'">'+d.art+'</svg>'+
    '</div></div>'+
    '<div id="dgBelow"></div>';
  wireView();
  $("#dgSel").addEventListener("change", function(){ dg.id = this.value; dg.shown = {}; dg.quiz = null; renderDiagrams(); });
  $("#dgMode").addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("button[data-m]") : null;
    if(!b) return;
    dg.mode = b.getAttribute("data-m"); dg.shown = {}; dg.quiz = null; renderDiagrams();
  });
  if(dg.mode === "reveal") revealMode(d); else quizMode(d);
}
function renderPlates(plates){
  var root = $("#dgRoot");
  if(!plates.length){
    root.innerHTML = '<div class="studyhead">'+viewToggle()+'</div>'+
      '<div class="empty">No plate for this unit. Switch to <b>All units</b> to see all '+PLATES.length+'.</div>';
    wireView(); return;
  }
  if(dg.pq){ renderPlateQuiz(); return; }
  if(dg.kq){ renderKeyQuiz(); return; }
  root.innerHTML =
    '<div class="studyhead">'+viewToggle()+
      '<button class="btn sm primary" id="plQuiz">Quiz: name the plate</button>'+
    '</div>'+
    '<p class="hintbar" style="margin:0 0 16px">Real anatomical figures, in the public domain. Read the caption, then find each item in the list before you move on.</p>'+
    '<div class="plates">'+plates.map(function(p){
      return '<article class="plate card'+(p.wide ? ' wide' : '')+'">'+
        '<div class="plimg"><img src="'+p.file+'" alt="'+esc(p.name)+'" loading="lazy"></div>'+
        '<div class="pltext"><h3>'+esc(p.name)+'</h3><p class="cap">'+p.caption+'</p>'+
        (p.find ? '<div class="find">'+p.find.map(function(f){ return '<span class="chip">'+esc(f)+'</span>'; }).join("")+'</div>' : '')+
        (p.key ? '<div style="margin-top:14px"><button class="btn sm primary" data-key="'+p.id+'">Quiz me on the numbers ('+p.key.length+')</button></div>' : '')+
        '<p class="credit">'+esc(p.credit)+'</p></div>'+
      '</article>';
    }).join("")+'</div>';
  wireView();
  $("#plQuiz").addEventListener("click", function(){
    dg.pq = plateQuiz(plates.length >= 4 ? plates : PLATES); dg.pqi = 0; dg.pscore = 0; renderPlates(plates);
  });
  $$("button[data-key]").forEach(function(b){
    b.addEventListener("click", function(){
      var p = PLATES.filter(function(x){ return x.id === b.getAttribute("data-key"); })[0];
      dg.kq = {plate:p, qs:plateKeyQuiz(p), i:0, score:0}; renderDiagrams();
    });
  });
}

      '<div class="card res" style="text-align:center">'+
        '<div class="ring" style="margin:0 auto"><svg width="132" height="132"><circle cx="66" cy="66" r="58" fill="none" stroke="var(--surface-3)" stroke-width="11"/>'+
        '<circle cx="66" cy="66" r="58" fill="none" stroke="var(--accent)" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-k.score/k.qs.length))+'"/></svg>'+
        '<div class="val">'+pct(k.score,k.qs.length)+'%<small>'+k.score+' of '+k.qs.length+'</small></div></div>'+
        '<p style="margin-top:12px;color:var(--ink-2)">'+esc(p.name)+'</p>'+

      '<div class="plimg quiz key"><img src="'+p.file+'" alt="Numbered figure"></div>'+
      '<p class="stem" style="margin-top:18px">What is structure number <b style="font-size:1.25em;color:var(--accent)">'+q.n+'</b>?</p>'+
      '<div class="opts" id="kOpts"></div><div id="kFb"></div>'+

    '</div>';

  var wrap = $("#kOpts");

function placePins(d, onClick, cls){
  var art = $("#dgArt");
  d.pins.forEach(function(p){
    var el = document.createElement("div");
    el.className = "hot" + (cls ? " "+cls(p) : "");
    el.style.left = (p.x / d.w * 100) + "%";
    el.style.top  = (p.y / d.h * 100) + "%";
    el.innerHTML = '<span class="pin">'+p.n+'</span><span class="lab">'+esc(p.label)+'</span>';
    el.addEventListener("click", function(){ onClick(p, el); });
    art.appendChild(el);
  });
}
function revealMode(d){
  placePins(d, function(p, el){
    dg.shown[p.n] = !dg.shown[p.n];
    el.classList.toggle("shown", !!dg.shown[p.n]);
  }, function(p){ return dg.shown[p.n] ? "shown" : ""; });
  $("#dgBelow").innerHTML =
    '<div style="display:flex;gap:10px;margin:16px 0;flex-wrap:wrap">'+
      '<button class="btn sm" id="dgAll">Show all labels</button>'+
      '<button class="btn sm" id="dgNone">Hide all</button>'+
    '</div>'+
    '<div class="dglist">'+d.pins.map(function(p){
      return '<div class="dgitem"><span class="n">'+p.n+'</span><span><span class="nm">'+esc(p.label)+'</span> — <span class="ds">'+esc(p.note)+'</span></span></div>';
    }).join("")+'</div>';
  $("#dgAll").addEventListener("click", function(){ d.pins.forEach(function(p){ dg.shown[p.n]=1; }); renderDiagrams(); });
  $("#dgNone").addEventListener("click", function(){ dg.shown = {}; renderDiagrams(); });
}
function quizMode(d){
  if(!dg.quiz){ dg.quiz = diagramQuiz(d); dg.qi = 0; dg.score = 0; }
  if(dg.qi >= dg.quiz.length){
    $("#dgBelow").innerHTML =
      '<div class="card res" style="text-align:center;margin-top:16px">'+
        '<div class="ring" style="margin:0 auto"><svg width="132" height="132"><circle cx="66" cy="66" r="58" fill="none" stroke="var(--surface-3)" stroke-width="11"/>'+
        '<circle cx="66" cy="66" r="58" fill="none" stroke="var(--accent)" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+(2*Math.PI*58)+'" stroke-dashoffset="'+(2*Math.PI*58*(1-dg.score/dg.quiz.length))+'"/></svg>'+
        '<div class="val">'+pct(dg.score,dg.quiz.length)+'%<small>'+dg.score+' of '+dg.quiz.length+'</small></div></div>'+
        '<div style="margin-top:18px"><button class="btn primary" id="dgRetry">Go again</button></div>'+
      '</div>';
    $("#dgRetry").addEventListener("click", function(){ dg.quiz = null; renderDiagrams(); });
    return;
  }
  var q = dg.quiz[dg.qi];
  placePins(d, function(){}, function(p){ return p.n === q.n ? "hit" : ""; });
  $("#dgBelow").innerHTML =
    '<div class="card qbox" style="margin-top:16px">'+
      '<span class="qcount">Structure '+(dg.qi+1)+' of '+dg.quiz.length+'</span>'+
      '<p class="stem">Which structure is marked <b>'+q.n+'</b>?</p>'+
      '<div class="opts" id="dgOpts"></div>'+
      '<div id="dgFb"></div>'+
      '<div class="qfoot"><span></span><button class="btn primary" id="dgNext" hidden>Next</button></div>'+
    '</div>';
  var wrap = $("#dgOpts");
  q.opts.forEach(function(o, i){
    var b = document.createElement("button");
    b.type = "button"; b.className = "opt";
    b.innerHTML = '<span class="k">'+String.fromCharCode(65+i)+'</span><span>'+esc(o.t)+'</span>';
    b.addEventListener("click", function(){
      if(b.disabled) return;
      $$("#dgOpts .opt").forEach(function(x, j){
        x.disabled = true;
        if(q.opts[j].ok) x.classList.add("correct");
      });
      if(!o.ok) b.classList.add("wrong"); else dg.score++;
      $("#dgFb").innerHTML = '<div class="fb '+(o.ok?"good":"bad")+'"><span class="lead">'+(o.ok?"Correct":"Not this one")+'</span>'+esc(q.label)+' — '+esc(q.note)+'</div>';
      var nb = $("#dgNext"); nb.hidden = false; nb.focus();
    });
    wrap.appendChild(b);
  });
  $("#dgNext").addEventListener("click", function(){ dg.qi++; renderDiagrams(); });

/* ================================================================ 5. PROGRESS */
function renderProgress(){
  var day = todayIndex();
  var cards = ALL_CARDS, seen = 0, mastered = 0, due = 0, lapses = [];
  cards.forEach(function(c){
    var st = DB.cards[c.id];
    if(st && st.seen) seen++;
    if(isMastered(st)) mastered++;
    if(isDue(st || newState(), day)) due++;
    if(st && st.lapse >= 2) lapses.push({c:c, n:st.lapse});
  });
  var qSeen = 0, qRight = 0, sureN = 0, sureR = 0, missedQ = [];
  ALL_QS.forEach(function(q){
    var r = DB.qs[q.id]; if(!r || !r.seen) return;
    qSeen += r.seen; qRight += r.right; sureN += r.sure || 0; sureR += r.sureRight || 0;
    if(r.right < r.seen) missedQ.push({q:q, n:r.seen - r.right});
  });
  lapses.sort(function(a,b){ return b.n - a.n; });
  missedQ.sort(function(a,b){ return b.n - a.n; });
  var html =
    '<div class="stats">'+
      '<div class="stat accent"><div class="n">'+due+'</div><div class="l">cards due now</div></div>'+
      '<div class="stat"><div class="n">'+mastered+'<span style="font-size:15px;color:var(--muted)">/'+cards.length+'</span></div><div class="l">cards mastered</div></div>'+
      '<div class="stat"><div class="n">'+seen+'</div><div class="l">cards started</div></div>'+
      '<div class="stat"><div class="n">'+(qSeen ? pct(qRight,qSeen)+"%" : "—")+'</div><div class="l">exam accuracy ('+qSeen+' answered)</div></div>'+
    '</div>'+
    '<div class="card" style="padding:18px 20px">'+
      '<div class="h-sec"><h2>Mastery by unit</h2><span class="sub">a card counts as mastered from box 4</span></div>'+
      '<div class="plist">'+UNITS.map(function(u){
        var cs = u.cards, m = 0;
        cs.forEach(function(c){ if(isMastered(DB.cards[c.id])) m++; });
        var p = pct(m, cs.length);
        return '<div class="prow"><span class="nm">'+esc(u.name)+'<small>'+cs.length+' cards · '+u.qs.length+' questions</small></span>'+
               '<span class="track"><i style="width:'+p+'%"></i></span><span class="pc">'+p+'%</span></div>';
      }).join("")+'</div>'+
    '</div>'+
    (sureN ? '<div class="callout"><b>Calibration.</b> When you marked yourself sure, you were right '+pct(sureR,sureN)+'% of the time across '+sureN+' questions. '+
      (pct(sureR,sureN) >= 90 ? 'That is well calibrated.' : 'The gap between feeling sure and being right is where exam points go missing.')+'</div>' : '')+
    (lapses.length ? '<div class="card" style="padding:18px 20px;margin-top:16px">'+
      '<div class="h-sec"><h2>Cards that keep catching you</h2></div>'+
      '<div class="plist">'+lapses.slice(0,6).map(function(x){
        return '<div class="prow" style="grid-template-columns:1fr auto"><span class="nm">'+x.c.f+'<small>'+esc(x.c.unitName)+'</small></span><span class="pc">missed '+x.n+'×</span></div>';
      }).join("")+'</div></div>' : '')+
    (missedQ.length ? '<div class="card" style="padding:18px 20px;margin-top:16px">'+
      '<div class="h-sec"><h2>Questions you have missed</h2><span class="sub">'+missedQ.length+' total</span></div>'+
      '<div class="plist">'+missedQ.slice(0,6).map(function(x){
        return '<div class="prow" style="grid-template-columns:1fr auto"><span class="nm">'+x.q.s+'<small>'+esc(x.q.unitName)+' · '+(x.q.o===2?'application':'recall')+'</small></span><span class="pc">×'+x.n+'</span></div>';
      }).join("")+'</div>'+
      '<div style="margin-top:14px"><button class="btn sm" id="pMissed">Build an exam from these</button></div></div>' : '')+
    '<div style="margin-top:20px;text-align:center"><button class="btn ghost sm" id="pReset">Erase all progress on this device</button></div>';
  $("#progRoot").innerHTML = html;
  if($("#pMissed")) $("#pMissed").addEventListener("click", function(){
    examCfg.scope = "missed"; mode = "exam"; DB.prefs.mode = mode; save(); renderAll();
  });
  $("#pReset").addEventListener("click", function(){
    if(!window.confirm("Erase every card schedule and exam record stored in this browser? This cannot be undone.")) return;
    DB.cards = {}; DB.qs = {}; save(); sess = null; exam = null; renderAll();
  });
}

/* ================================================================ keyboard */
document.addEventListener("keydown", function(e){
  var t = e.target, tag = (t && t.tagName) || "";
  if(/INPUT|TEXTAREA|SELECT/.test(tag)) return;
  if(mode === "study" && sess){
    if(e.key === " " || e.key === "Spacebar"){
      e.preventDefault();
      if(!sess.flipped){ sess.flipped = true; renderStudy(); }
      return;
    }
    if(sess.flipped && /^[1-4]$/.test(e.key)){ e.preventDefault(); rate(parseInt(e.key,10)-1); }
  } else if(mode === "exam" && exam){
    if(/^[a-dA-D]$/.test(e.key)){
      var i = e.key.toLowerCase().charCodeAt(0) - 97;
      var b = $$("#opts .opt")[i];
      if(b && !b.disabled){ e.preventDefault(); b.click(); }
    } else if(e.key === "Enter"){
      var nb = $("#qNext");
      if(nb && !nb.hidden){ e.preventDefault(); nb.click(); }
    }
  }
});

/* ================================================================ boot */
function renderAll(){
  showMode(); updateMeta(); updateDue();
  if(mode === "study"){ sess = null; renderStudy(); }
  else if(mode === "exam"){ exam = null; renderExamSetup(); }
  else if(mode === "match"){ match = null; newMatch(); }
  else if(mode === "diagrams"){ dg.quiz = null; dg.shown = {}; renderDiagrams(); }
  else renderProgress();
}
renderAll();

})();
</script>
</body>
</html>
