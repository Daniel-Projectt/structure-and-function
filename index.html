<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="apple-touch-icon" href="icon.png">

<meta property="og:url" content="https://daniel-projectt.github.io/structure-and-function/">
<meta property="og:title" content="Structure &amp; Function &mdash; Study Lab">
<meta property="og:description" content="Spaced-repetition flashcards, practice exams with application questions, matching and labeled diagrams.">
<meta property="og:image" content="https://daniel-projectt.github.io/structure-and-function/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<style>
:root{
  color-scheme:light;
  --bg:#f4f6f7;
  --surface:#ffffff;
  --surface-2:#f8fafb;
  --surface-3:#eef2f4;
  --ink:#10161b;
  --ink-2:#39444d;
  --muted:#6d7a85;
  --line:#e0e6ea;
  --line-2:#c9d3da;
  --accent:#0f6b63;
  --accent-soft:#e2f1ef;
  --accent-ink:#0b524c;
  --apply:#9a5b06;
  --apply-soft:#fbf0dd;
  --ok:#186b3a;
  --ok-soft:#e6f2ea;
  --bad:#a92e22;
  --bad-soft:#fbeae8;
  --shadow:0 1px 2px rgba(16,22,27,.06), 0 8px 24px rgba(16,22,27,.06);
  --shadow-lg:0 2px 6px rgba(16,22,27,.07), 0 18px 44px rgba(16,22,27,.10);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Cambria,Georgia,serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  --r:10px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1316;
  --surface:#161d22;
  --surface-2:#1b2429;
  --surface-3:#212c32;
  --ink:#e7edf1;
  --ink-2:#bcc8d1;
  --muted:#8c9aa5;
  --line:#26323a;
  --line-2:#3a4954;
  --accent:#3fc9b9;
  --accent-soft:#12312e;
  --accent-ink:#8ae4d8;
  --apply:#e5a44b;
  --apply-soft:#33270f;
  --ok:#4ec07c;
  --ok-soft:#12291b;
  --bad:#ef7a6b;
  --bad-soft:#2d1614;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
  --shadow-lg:0 2px 6px rgba(0,0,0,.45), 0 18px 44px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.25;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------------- top bar ---------------- */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
@supports not (backdrop-filter:blur(2px)){ .topbar{background:var(--surface)} }
.topbar .row{display:flex;align-items:center;gap:14px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.02em;font-size:15.5px;white-space:nowrap}
.brand .mk{width:26px;height:26px;flex:0 0 auto;color:var(--accent)}
.brand small{display:block;font-weight:450;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:-3px}
.spacer{flex:1}
.iconbtn{background:none;border:1px solid transparent;border-radius:8px;padding:7px;cursor:pointer;color:var(--muted);line-height:0;transition:.15s}
.iconbtn:hover{color:var(--ink);background:var(--surface-3)}
.duepill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.duepill b{font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .duepill{color:var(--accent)}

/* ---------------- mode tabs ---------------- */
.modes{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);background:var(--surface)}
.modes::-webkit-scrollbar{display:none}
.modes .inner{display:flex;gap:2px;max-width:980px;margin:0 auto;padding:0 12px;width:100%}
.mode{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px;font-size:13.5px;font-weight:550;color:var(--muted);cursor:pointer;white-space:nowrap;transition:.15s;min-height:46px}
.mode:hover{color:var(--ink)}
.mode[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* ---------------- unit bar ---------------- */
.unitbar{background:var(--surface-2);border-bottom:1px solid var(--line)}
.unitbar .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 0}
.lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
select,.sel{font:inherit;font-size:14px;padding:8px 32px 8px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;
  appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236d7a85' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 8px center;background-size:16px;max-width:100%}
.unitmeta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------------- generic ---------------- */
main{padding:22px 0 64px}
.panel[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;font-weight:550;padding:10px 16px;min-height:42px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:8px;color:var(--ink);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#07211f}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:12.5px;padding:7px 12px;min-height:36px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-3);border-radius:9px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:7px;padding:8px 13px;font-size:12.5px;font-weight:550;color:var(--muted);cursor:pointer;transition:.15s;min-height:36px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,22,27,.10)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--line)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--surface-3);color:var(--muted)}
.tag.apply{background:var(--apply-soft);color:var(--apply)}
.tag.recall{background:var(--accent-soft);color:var(--accent-ink)}
:root[data-theme="dark"] .tag.recall{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:15px}
.empty svg{color:var(--line-2);margin-bottom:12px}
.h-sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.h-sec h2{font-size:17px}
.h-sec .sub{font-size:12.5px;color:var(--muted)}
.hintbar{font-size:12.5px;color:var(--muted);text-align:center;margin-top:14px}
kbd{font:inherit;font-size:11px;font-family:var(--mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--surface-2);color:var(--ink-2)}

/* ---------------- study / flashcards ---------------- */
.studyhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.chips{display:flex;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips b{color:var(--ink);font-weight:600}
.fcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);min-height:330px;display:flex;flex-direction:column;cursor:pointer;overflow:hidden}
.fcard .top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:14px 14px 0 0}
.fcard .unitname{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fcard .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 26px;gap:16px}
.fcard .front{font-size:clamp(20px,3.6vw,27px);font-weight:600;letter-spacing:-.015em;line-height:1.3;max-width:34ch}
.fcard .back{border-top:1px dashed var(--line-2);width:100%;padding-top:20px;margin-top:2px}
.fcard .ans{font-size:clamp(17px,2.8vw,20px);line-height:1.5;max-width:46ch;margin:0 auto;color:var(--ink)}
.fcard .why{margin:14px auto 0;max-width:48ch;font-size:14px;line-height:1.55;color:var(--ink-2);background:var(--surface-2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:11px 14px;text-align:left}
.fcard .why b{color:var(--accent-ink);font-weight:650}
:root[data-theme="dark"] .fcard .why b{color:var(--accent)}
.fcard .tapzone{font-size:12.5px;color:var(--muted);padding:0 0 22px;text-align:center}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.rate button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 6px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;transition:.15s;min-height:56px}
.rate button span{font-size:10.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.rate button:hover{border-color:var(--accent);color:var(--accent)}
.rate button[data-q="0"]:hover{border-color:var(--bad);color:var(--bad)}
.bar{height:4px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin:16px 0 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s}

/* ---------------- exam ---------------- */
.setup{padding:24px}
.setup .grp{margin-bottom:20px}
.setup .grp:last-of-type{margin-bottom:0}
.setup .glab{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;display:block}
.setup .note{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.5}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.qcount{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:550}
.timer{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--muted)}
.timer.warn{color:var(--bad)}
.qbox{padding:26px 26px 22px}
.stem{font-size:clamp(16.5px,2.4vw,18.5px);line-height:1.6;margin:12px 0 0;max-width:62ch}
.stem .vig{display:block;color:var(--ink-2);margin-bottom:10px;font-size:.94em;line-height:1.6}
.opts{display:grid;gap:9px;margin-top:20px}
.opt{display:flex;align-items:flex-start;gap:11px;text-align:left;padding:13px 15px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);cursor:pointer;transition:.13s;font-size:14.8px;line-height:1.45;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--surface-2)}
.opt .k{flex:0 0 auto;width:22px;height:22px;border-radius:5px;background:var(--surface-3);color:var(--muted);font-size:11.5px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.opt .why{display:block;font-size:12.8px;color:var(--ink-2);margin-top:6px;line-height:1.45}
.fb{margin-top:18px;border-radius:9px;padding:14px 16px;font-size:14.2px;line-height:1.55;border-left:3px solid}
.fb.good{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb .lead{font-weight:650;display:block;margin-bottom:4px}
.fb.good .lead{color:var(--ok)}
.fb.bad .lead{color:var(--bad)}
.conf{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.conf button{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);min-height:32px}
.conf button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line-2);transition:.2s}
.dots i.on{background:var(--accent);transform:scale(1.4)}
.dots i.ok{background:var(--ok)}
.dots i.no{background:var(--bad)}

/* results */
.res{padding:30px 26px}
.scorewrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap;justify-content:center;text-align:center}
.ring{position:relative;width:132px;height:132px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:29px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .val small{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.verdict{max-width:38ch;text-align:left}
.verdict h3{font-size:19px;margin-bottom:6px}
.verdict p{font-size:14px;color:var(--ink-2);line-height:1.55}
.breakdown{margin-top:26px;display:grid;gap:10px}
.brow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .nm{color:var(--ink-2)}
.brow .sc{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.brow .mini{grid-column:1/-1;height:4px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.brow .mini i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.brow .mini i.low{background:var(--bad)}
.brow .mini i.mid{background:var(--apply)}
.misses{margin-top:26px;display:grid;gap:10px}
.miss{border:1px solid var(--line);border-radius:9px;padding:13px 15px;background:var(--surface-2)}
.miss .q{font-size:14px;font-weight:550;line-height:1.45}
.miss .a{font-size:13.2px;color:var(--ink-2);margin-top:6px;line-height:1.5}
.miss .a b{color:var(--ok)}

/* ---------------- match ---------------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;text-align:center;font-weight:650}
.tiles{display:grid;gap:8px}
.tile{padding:12px 13px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);cursor:pointer;font-size:14px;line-height:1.35;text-align:left;transition:.13s;min-height:50px;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--accent)}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tile.done{opacity:.35;pointer-events:none;border-style:dashed;border-color:var(--ok);color:var(--ok)}
.tile.bad{animation:shake .35s;border-color:var(--bad);background:var(--bad-soft)}
.tile.term{font-weight:600}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.banner{text-align:center;background:var(--ok-soft);border:1px solid var(--ok);color:var(--ok);border-radius:9px;padding:13px;margin-bottom:16px;font-size:14px;font-weight:550}

/* ---------------- diagrams ---------------- */
.dgwrap{display:grid;gap:16px}
.dgstage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.dgart{position:relative;margin:0 auto;width:100%}
.dgstage svg.art{display:block;width:100%;height:auto}
.hot{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:0;cursor:pointer;z-index:2}
.pin{width:25px;height:25px;border-radius:99px;background:var(--surface);border:2px solid var(--accent);color:var(--accent);font-size:12px;font-weight:700;display:grid;place-items:center;box-shadow:var(--shadow);transition:.15s;flex:0 0 auto}
.hot:hover .pin{background:var(--accent);color:#fff}
.hot.shown .pin{background:var(--accent);color:#fff}
:root[data-theme="dark"] .hot:hover .pin,:root[data-theme="dark"] .hot.shown .pin{color:#07211f}
.hot .lab{margin-left:7px;background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:4px 9px;font-size:12.5px;font-weight:600;white-space:nowrap;box-shadow:var(--shadow);opacity:0;transform:translateX(-4px);transition:.18s;pointer-events:none;max-width:42vw;overflow:hidden;text-overflow:ellipsis}
.hot.shown .lab{opacity:1;transform:translateX(0)}
.hot.miss .pin{border-color:var(--bad);color:var(--bad)}
.hot.hit .pin{border-color:var(--ok);background:var(--ok);color:#fff}
.dglist{display:grid;gap:7px;margin-top:4px}
.dgitem{display:flex;gap:10px;align-items:baseline;font-size:13.8px;padding:8px 11px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.dgitem .n{flex:0 0 auto;width:21px;height:21px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center}
:root[data-theme="dark"] .dgitem .n{color:var(--accent)}
.dgitem .nm{font-weight:600}
.dgitem .ds{color:var(--ink-2);font-size:13px}

/* ---------------- plates ---------------- */
.plates{display:grid;gap:16px}
.plate{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:0;overflow:hidden}
.plimg{background:#fff;padding:14px;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line)}
.plimg img{max-width:100%;max-height:340px;height:auto;display:block}
.plimg.quiz{border:1px solid var(--line);border-radius:9px;border-right:1px solid var(--line);max-width:420px;margin:0 auto}
.plimg.quiz img{max-height:300px}
.plimg.quiz.key{max-width:100%}
.plimg.quiz.key img{max-height:min(78vh,900px)}
.plate.wide{grid-template-columns:1fr}
.plate.wide .plimg{border-right:0;border-bottom:1px solid var(--line)}
.plate.wide .plimg img{max-height:none}
.pltext{padding:18px 20px}
.pltext h3{font-size:16px;margin-bottom:8px}
.pltext .cap{font-size:14px;line-height:1.55;color:var(--ink-2)}
.pltext .cap i{color:var(--ink);font-style:italic}
.find{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:12px;font-weight:550;padding:4px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink)}
:root[data-theme="dark"] .chip{color:var(--accent)}
.credit{font-size:11px;color:var(--muted);margin-top:12px}
@media (max-width:720px){ .plate{grid-template-columns:1fr} .plimg{border-right:0;border-bottom:1px solid var(--line)} }

/* ---------------- progress ---------------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stat .n{font-size:27px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:550}
.stat.accent .n{color:var(--accent)}
.plist{display:grid;gap:2px}
.prow{display:grid;grid-template-columns:1fr 92px 54px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:550;line-height:1.3}
.prow .nm small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.prow .track{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.prow .track i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.prow .pc{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;font-weight:650;color:var(--muted)}
.callout{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--apply);border-radius:0 var(--r) var(--r) 0;padding:15px 17px;font-size:14px;line-height:1.55;color:var(--ink-2);margin-top:20px}
.callout b{color:var(--ink)}

@media (max-width:720px){
  body{font-size:15.5px}
  .mgrid{grid-template-columns:1fr;gap:18px}
  .rate{grid-template-columns:repeat(2,1fr)}

  .prow{grid-template-columns:1fr 60px 44px;gap:8px}
  .brand small{display:none}

}

  .topbar,.modes,.unitbar,.rate,.btn,.conf{display:none!important}
  body{background:#fff}
  .card,.fcard{box-shadow:none}
}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }

<script>
(function(){
"use strict";

/* =====================================================================
   CONTENT
   Each unit: cards (front / back / why it matters) and questions.
   q.o = 1 for recall, 2 for second-order (apply it to a new situation).
   ===================================================================== */
var UNITS = [];
if(typeof window !== "undefined"){ window.__UNITS = UNITS; } else { global.__UNITS = UNITS; }

/* ---------------------------------------------------------- 1. ORGANIZATION */
UNITS.push({
id:"org", name:"Body Organization & Homeostasis", short:"Organization",
blurb:"The vocabulary every later unit assumes: position, direction, planes, cavities, and how the body holds itself steady.",
cards:[
 {id:"org-c1", f:"Anatomical position", b:"Body erect, feet flat and slightly apart, arms at the sides, palms facing forward, head and eyes forward.",
  why:"Every directional term is defined from this position. <b>Palms forward</b> is why the radius is described as lateral, even though the bones cross when you pronate."},
 {id:"org-c2", f:"Anterior (ventral) vs. posterior (dorsal)", b:"Anterior = toward the front of the body; posterior = toward the back.",
  why:"In four-legged animals ventral means belly-side and dorsal means back-side. In humans standing upright the two sets of terms line up, which is why textbooks use them interchangeably."},
 {id:"org-c3", f:"Superior vs. inferior", b:"Superior = toward the head; inferior = toward the feet.",
  why:"Used for the trunk and head. For limbs, proximal and distal are the correct terms."},
 {id:"org-c4", f:"Medial vs. lateral", b:"Medial = toward the midline of the body; lateral = away from the midline.",
  why:"The terms are relative, not absolute: the ulna is medial to the radius, but lateral to the midline of the body."},
 {id:"org-c5", f:"Proximal vs. distal", b:"Proximal = closer to the point of attachment to the trunk; distal = farther from it.",
  why:"Only used for limbs. The knee is proximal to the ankle and distal to the hip."},
 {id:"org-c6", f:"Superficial vs. deep", b:"Superficial = closer to the body surface; deep = farther beneath it.",
  why:"Describes depth, not direction along the body. Skin is superficial to muscle everywhere."},
 {id:"org-c7", f:"Ipsilateral vs. contralateral", b:"Ipsilateral = on the same side of the body; contralateral = on opposite sides.",
  why:"Critical in neurology: most motor tracts cross, so a stroke on one side of the brain causes contralateral weakness."},
 {id:"org-c8", f:"Sagittal plane", b:"A vertical plane dividing the body into right and left portions. A midsagittal (median) cut gives equal halves.",
  why:"Any cut parallel to the midline but off-center is parasagittal."},
 {id:"org-c9", f:"Frontal (coronal) plane", b:"A vertical plane dividing the body into anterior and posterior portions.",
  why:"Named for the coronal suture, which runs across the skull in the same direction."},
 {id:"org-c10", f:"Transverse (horizontal) plane", b:"A plane dividing the body into superior and inferior portions; produces a cross section.",
  why:"This is the plane of a CT slice, which is why CT images look like you are viewing the patient from the feet up."},
 {id:"org-c11", f:"Dorsal body cavity", b:"The posterior cavity, made of the cranial cavity (brain) and the vertebral canal (spinal cord).",
  why:"Both are lined by the meninges and filled with cerebrospinal fluid — one continuous protected space."},
 {id:"org-c12", f:"Ventral body cavity", b:"The anterior cavity, divided by the diaphragm into the thoracic cavity above and the abdominopelvic cavity below.",
  why:"The diaphragm is the dividing line — and the reason a deep stab wound below the ribs can enter either cavity."},
 {id:"org-c13", f:"Divisions of the thoracic cavity", b:"Two pleural cavities (one per lung) and the mediastinum between them, which contains the pericardial cavity and the heart.",
  why:"The lungs sit in separate sealed sacs, so a collapse on one side does not automatically collapse the other."},
 {id:"org-c14", f:"Serous membrane", b:"A two-layered membrane: the parietal layer lines the cavity wall, the visceral layer covers the organ, and serous fluid sits between them.",
  why:"The fluid lets organs slide with almost no friction. Inflammation of these layers (pleurisy, pericarditis) is intensely painful with every breath or heartbeat."},
 {id:"org-c15", f:"The three serous membranes", b:"Pericardium (heart), pleura (lungs), peritoneum (abdominal organs).",
  why:"Same design, three locations: parietal layer outside, visceral layer hugging the organ."},
 {id:"org-c16", f:"Levels of organization", b:"Chemical → cellular → tissue → organ → organ system → organism.",
  why:"A tissue is a group of similar cells with a common function; an organ contains two or more tissue types."},
 {id:"org-c17", f:"Homeostasis", b:"Maintaining a relatively stable internal environment despite changes outside the body.",
  why:"“Stable” means oscillating narrowly around a set point, not fixed. Body temperature swings about a degree over a normal day."},
 {id:"org-c18", f:"The three parts of a feedback loop", b:"Receptor (detects the change) → control center or integrator (compares to the set point and decides) → effector (carries out the response).",
  why:"When homeostasis fails, the question is always which of these three broke."},
 {id:"org-c19", f:"Negative feedback", b:"The response opposes and reverses the original change, returning the variable toward its set point.",
  why:"This runs nearly every system in the body: temperature, blood glucose, blood pressure, blood calcium."},
 {id:"org-c20", f:"Positive feedback", b:"The response amplifies the original change, driving it further until an outside event ends the cycle.",
  why:"Only safe when there is a definite end point: childbirth (oxytocin), blood clotting, and the LH surge before ovulation."},
 {id:"org-c21", f:"Set point", b:"The target value a control center defends, such as roughly 37°C for core body temperature.",
  why:"A fever is not a broken thermostat — it is the set point deliberately raised, which is why you feel cold and shiver while your temperature climbs."},
 {id:"org-c22", f:"Abdominopelvic quadrants", b:"Right upper, left upper, right lower, left lower — divided by one vertical and one horizontal line through the navel.",
  why:"Quadrants are the fast clinical shorthand: appendix pain is classically right lower quadrant."},
 {id:"org-c23", f:"The nine abdominopelvic regions", b:"Right and left hypochondriac with epigastric between; right and left lumbar with umbilical between; right and left iliac (inguinal) with hypogastric between.",
  why:"More precise than quadrants, used to localize organs and describe findings."},
 {id:"org-c24", f:"Gradient", b:"A difference in concentration, pressure, charge, or temperature between two regions; matter and energy flow down a gradient.",
  why:"Nearly all physiology reduces to building a gradient with energy, then letting something flow down it."}
],
qs:[
 {id:"org-q1", o:1, s:"Which plane divides the body into right and left portions?",
  a:[{t:"Sagittal", ok:true, w:"Vertical, parallel to the midline; a midsagittal cut gives equal halves."},
     {t:"Frontal (coronal)", w:"Divides anterior from posterior."},
     {t:"Transverse", w:"Divides superior from inferior."},
     {t:"Oblique", w:"Any cut at an angle to the other three, not a defined left-right division."}],
  e:"Sagittal = right/left, frontal = front/back, transverse = top/bottom."},
 {id:"org-q2", o:1, s:"The wrist is ______ to the elbow.",
  a:[{t:"Distal", ok:true, w:"Farther from the trunk attachment of the limb."},
     {t:"Proximal", w:"Proximal means closer to the trunk — that describes the elbow relative to the wrist."},
     {t:"Inferior", w:"Superior and inferior are used for the trunk and head, not for positions along a limb."},
     {t:"Medial", w:"Medial refers to the midline of the body, not to distance along a limb."}],
  e:"Along a limb, always reach for proximal and distal."},
 {id:"org-q3", o:2, v:"A surgeon opens the chest and works toward the heart, passing through each layer in turn.",
  s:"Which layer does the scalpel reach last, immediately against the heart muscle itself?",
  a:[{t:"Visceral pericardium", ok:true, w:"The visceral layer of any serous membrane is the one covering the organ."},
     {t:"Parietal pericardium", w:"Lines the outside of the pericardial sac; reached before the cavity."},
     {t:"Pericardial cavity", w:"The fluid-filled space between the two layers, not a layer against the muscle."},
     {t:"Parietal pleura", w:"That belongs to the lungs, not the heart."}],
  e:"Parietal lines the wall, visceral covers the viscus. The rule holds for pericardium, pleura and peritoneum alike."},
 {id:"org-q4", o:2, v:"A hiker is caught in the cold. Her core temperature starts to drop, and within minutes she is shivering hard.",
  s:"In this loop, what role is the skeletal muscle playing, and what type of feedback is this?",
  a:[{t:"Effector, in a negative feedback loop", ok:true, w:"Muscle carries out the response, and shivering generates heat that opposes the drop."},
     {t:"Receptor, in a negative feedback loop", w:"Receptors detect the change — here that is the thermoreceptors, not the muscle."},
     {t:"Effector, in a positive feedback loop", w:"The response reverses the change rather than amplifying it, so it is negative feedback."},
     {t:"Control center, in a negative feedback loop", w:"The control center is the hypothalamus, which compares the input to the set point."}],
  e:"Receptor detects, control center decides, effector acts. Opposing the change makes it negative feedback."},
 {id:"org-q5", o:2, v:"A vessel is cut. Platelets stick to the injury and release chemicals that attract still more platelets, which release still more.",
  s:"Why is this correctly called positive feedback rather than a failure of homeostasis?",
  a:[{t:"The response amplifies the original change, and a definite end point — a sealed vessel — stops the cycle", ok:true,
      w:"Positive feedback is safe precisely when an external event terminates it."},
     {t:"It restores the variable to its set point", w:"That describes negative feedback; clotting drives the change further, not back."},
     {t:"It is slower than negative feedback and so causes no harm", w:"Speed is not the distinction, and clotting is fast."},
     {t:"It involves no receptor or effector", w:"Both are present; the difference is the direction of the response."}],
  e:"Positive feedback appears in the body only where runaway amplification ends in a completed event: a clot, a birth, an ovulation."},
 {id:"org-q6", o:1, s:"Which structure separates the thoracic cavity from the abdominopelvic cavity?",
  a:[{t:"The diaphragm", ok:true, w:"A dome of skeletal muscle forming the floor of the thoracic cavity."},
     {t:"The mediastinum", w:"The region between the lungs, inside the thoracic cavity."},
     {t:"The parietal peritoneum", w:"Lines the abdominal wall; it does not divide the two cavities."},
     {t:"The pelvic brim", w:"Marks the boundary between the abdominal and pelvic portions, both below the diaphragm."}],
  e:"One muscle divides the entire ventral cavity in two."},
 {id:"org-q7", o:2, v:"A 19-year-old arrives with pain that began near the navel and has settled into a sharp point low on the right side.",
  s:"Which quadrant does this pain localize to, and which organ does that raise concern for?",
  a:[{t:"Right lower quadrant — the appendix", ok:true, w:"The classic migration of appendicitis pain from periumbilical to right lower quadrant."},
     {t:"Right upper quadrant — the gallbladder", w:"Gallbladder pain sits under the right ribs, not low."},
     {t:"Left lower quadrant — the sigmoid colon", w:"Correct organ for that quadrant, but the pain described is on the right."},
     {t:"Epigastric region — the stomach", w:"Epigastric is high and central, just below the sternum."}],
  e:"Quadrants exist for exactly this: turning a location into a short list of organs."},
 {id:"org-q8", o:1, s:"Place the levels of organization in order, simplest first.",
  a:[{t:"Chemical → cellular → tissue → organ → organ system → organism", ok:true, w:"Each level is built from the one before it."},
     {t:"Cellular → chemical → tissue → organ → organism → organ system", w:"Chemicals build cells, and an organ system is larger than one organ."},
     {t:"Chemical → tissue → cellular → organ → organ system → organism", w:"Cells come before tissues — a tissue is a group of cells."},
     {t:"Cellular → tissue → organ → chemical → organ system → organism", w:"The chemical level is the foundation, not a later step."}],
  e:"A tissue is similar cells with one job; an organ contains at least two tissue types."},
 {id:"org-q9", o:2, v:"A patient's thermoreceptors in the skin are destroyed over a large area by deep burns.",
  s:"Which part of the temperature feedback loop has failed, and what is the immediate consequence?",
  a:[{t:"The receptor — the change is never detected, so no correction is ordered", ok:true,
      w:"Without input, the control center has nothing to compare to the set point."},
     {t:"The control center — the set point is lost", w:"The hypothalamus still holds the set point; it simply gets no signal."},
     {t:"The effector — the body can no longer shiver", w:"Skeletal muscle is intact and could respond if it were told to."},
     {t:"The set point — it resets to the ambient temperature", w:"Set points are not reset by loss of sensory input."}],
  e:"When a loop fails, ask which of the three parts broke: detect, decide, or act."},
 {id:"org-q10", o:1, s:"The mediastinum contains all of the following EXCEPT:",
  a:[{t:"The lungs", ok:true, w:"The lungs sit in the pleural cavities on either side of the mediastinum, not within it."},
     {t:"The heart and pericardium", w:"The pericardial cavity lies within the mediastinum."},
     {t:"The esophagus and trachea", w:"Both pass through the mediastinum."},
     {t:"The thymus and great vessels", w:"Both are mediastinal structures."}],
  e:"The mediastinum is the space between the two pleural cavities — everything in the chest except the lungs themselves."},
 {id:"org-q11", o:2, v:"An MRI is ordered and the images show the body divided into front and back halves, with the nose and the back of the head in the same slice.",
  s:"Which plane was used?",
  a:[{t:"Frontal (coronal)", ok:true, w:"Divides anterior from posterior, so front and back structures appear in one image."},
     {t:"Midsagittal", w:"Would divide left from right — the nose would appear but not both sides symmetrically."},
     {t:"Transverse", w:"Would show a cross section, dividing superior from inferior."},
     {t:"Oblique", w:"An angled cut, not the standard front-back division described."}],
  e:"Name the plane by what it separates, not by what it shows."},
 {id:"org-q12", o:2, s:"A drug raises the hypothalamic set point for body temperature from 37°C to 39°C. What does the patient feel and do first?",
  a:[{t:"Feels cold and shivers, because 37°C is now read as too low", ok:true,
      w:"The body defends the new, higher set point by generating and conserving heat."},
     {t:"Feels hot and sweats, because the temperature is above normal", w:"Sweating comes later, when the set point falls back and the body is now too warm."},
     {t:"Feels nothing, because the actual temperature has not changed yet", w:"The comparison to the set point is what generates the sensation, and that changed immediately."},
     {t:"Feels hot and shivers at the same time", w:"The responses are coordinated, not contradictory."}],
  e:"This is exactly what a fever's onset is: chills and shivering while the temperature climbs to the new set point."}
]});

/* ---------------------------------------------------------- 2. CHEMISTRY */
UNITS.push({
id:"chem", name:"Chemistry of Life", short:"Chemistry",
blurb:"Bonds, water, pH and the four macromolecules — the level at which every physiological mechanism is actually happening.",
cards:[
 {id:"chem-c1", f:"Ionic bond", b:"One atom transfers an electron to another; the resulting oppositely charged ions attract.",
  why:"Ionic compounds dissociate in water into free ions — which is exactly what makes NaCl an electrolyte and lets nerves fire."},
 {id:"chem-c2", f:"Covalent bond", b:"Two atoms share a pair of electrons. Shared equally = nonpolar; shared unequally = polar.",
  why:"The strongest of the three bonds, and the reason carbon skeletons hold together while being chemically worked on."},
 {id:"chem-c3", f:"Hydrogen bond", b:"A weak attraction between a slightly positive hydrogen on one polar molecule and a slightly negative atom on another.",
  why:"Individually weak, collectively decisive: they hold water together, hold DNA's two strands together, and hold proteins in shape."},
 {id:"chem-c4", f:"Why water is a good solvent", b:"Water is polar, so it surrounds and separates charged and polar solutes into a hydration sphere.",
  why:"This is why “like dissolves like”: nonpolar lipids cannot be surrounded this way, so they clump — the basis of the cell membrane."},
 {id:"chem-c5", f:"High heat capacity of water", b:"Water absorbs a large amount of heat for a small rise in temperature, because energy first goes into breaking hydrogen bonds.",
  why:"Because the body is mostly water, core temperature stays stable through exercise and cold exposure."},
 {id:"chem-c6", f:"pH scale", b:"A measure of hydrogen ion concentration from 0 to 14; 7 is neutral, below 7 acidic, above 7 basic. Each unit is a tenfold change.",
  why:"A pH drop from 7.4 to 7.0 is not a small shift — it is more than double the H⁺, and it is fatal."},
 {id:"chem-c7", f:"Normal blood pH", b:"7.35 to 7.45. Below 7.35 is acidosis; above 7.45 is alkalosis.",
  why:"An astonishingly narrow window. Proteins change shape outside it, so enzymes and ion channels stop working."},
 {id:"chem-c8", f:"Buffer", b:"A system that resists change in pH by donating H⁺ when it falls and accepting H⁺ when it rises.",
  why:"The bicarbonate buffer system is the body's main one, and it is why breathing rate can correct blood pH within minutes."},
 {id:"chem-c9", f:"Carbohydrate: structure and role", b:"Made of C, H and O in about a 1:2:1 ratio. Monosaccharides (glucose), disaccharides (sucrose), polysaccharides (glycogen, starch).",
  why:"The body's fast fuel. Glycogen in liver and muscle is the short-term storage form."},
 {id:"chem-c10", f:"Lipid: structure and role", b:"Mostly nonpolar hydrocarbons: triglycerides (storage), phospholipids (membranes), steroids (cholesterol and the hormones made from it).",
  why:"Energy dense and water insoluble — both the reason fat stores so much energy and the reason lipids need carriers in blood."},
 {id:"chem-c11", f:"Phospholipid", b:"A polar phosphate head that is attracted to water and two nonpolar fatty acid tails that are not.",
  why:"That split personality is the entire reason a bilayer forms on its own, with tails hidden inside and heads facing the water on both sides."},
 {id:"chem-c12", f:"Protein: structure and role", b:"Chains of amino acids joined by peptide bonds. Roles: enzymes, structure, transport, movement, defense, signaling.",
  why:"The most versatile molecule in the body — and the one whose function depends most tightly on three-dimensional shape."},
 {id:"chem-c13", f:"Levels of protein structure", b:"Primary (amino acid sequence), secondary (helices and pleated sheets), tertiary (overall 3D fold), quaternary (multiple chains joined).",
  why:"The sequence dictates the fold, and the fold dictates the function — which is why a single wrong amino acid can cause sickle cell disease."},
 {id:"chem-c14", f:"Denaturation", b:"Loss of a protein's three-dimensional shape from heat, extreme pH or chemicals; the bonds holding the fold break.",
  why:"The peptide bonds survive, so the sequence is intact — but function is gone. This is why high fever is dangerous."},
 {id:"chem-c15", f:"Enzyme", b:"A biological catalyst, almost always a protein, that lowers the activation energy of a reaction and is not consumed by it.",
  why:"Enzymes do not make impossible reactions happen; they make slow ones fast enough to matter at body temperature."},
 {id:"chem-c16", f:"Active site and specificity", b:"The pocket on an enzyme that binds the substrate; its shape and charge admit only certain molecules.",
  why:"Specificity is why the body can run thousands of reactions simultaneously in the same cell without chaos."},
 {id:"chem-c17", f:"Nucleic acids", b:"DNA and RNA, built from nucleotides (a sugar, a phosphate and a nitrogenous base).",
  why:"DNA stores the instructions; RNA carries and executes them."},
 {id:"chem-c18", f:"ATP", b:"Adenosine triphosphate: the cell's immediate energy currency. Energy is released when the bond to the third phosphate is broken, giving ADP.",
  why:"Cells hold only seconds' worth of ATP, so it is continuously regenerated rather than stockpiled."},
 {id:"chem-c19", f:"Metabolism, catabolism, anabolism", b:"Metabolism is all chemical reactions in the body. Catabolism breaks molecules down and releases energy; anabolism builds them up and consumes energy.",
  why:"Catabolism funds anabolism — breaking down glucose is what pays for building proteins."},
 {id:"chem-c20", f:"Dehydration synthesis vs. hydrolysis", b:"Dehydration synthesis joins two molecules and removes a water molecule. Hydrolysis splits a molecule by adding water.",
  why:"Every macromolecule in the body is built and taken apart by these two opposite reactions — digestion is hydrolysis on a large scale."},
 {id:"chem-c21", f:"Electrolyte", b:"A substance that dissociates into ions in water and can therefore conduct an electrical current.",
  why:"Na⁺, K⁺, Ca²⁺ and Cl⁻ are why nerve impulses, muscle contraction and heartbeats are possible at all."}
],
qs:[
 {id:"chem-q1", o:1, s:"Which bond type holds the two strands of DNA together and keeps proteins folded?",
  a:[{t:"Hydrogen bonds", ok:true, w:"Individually weak, but numerous enough to be decisive — and weak enough to be opened for replication."},
     {t:"Covalent bonds", w:"These hold each strand's backbone together, not the two strands to each other."},
     {t:"Ionic bonds", w:"Present in some protein interactions, but not the bond holding base pairs."},
     {t:"Peptide bonds", w:"These join amino acids in a chain — a covalent bond, and not found in DNA."}],
  e:"Hydrogen bonds are the body's reusable fastener: strong in numbers, easy to open when needed."},
 {id:"chem-q2", o:2, v:"A patient's blood pH falls from 7.40 to 7.10 during a severe asthma attack.",
  s:"What is the most immediate physiological danger of this change?",
  a:[{t:"Proteins change shape, so enzymes and ion channels stop working normally", ok:true,
      w:"Protein conformation depends on pH; function follows shape."},
     {t:"Cell membranes dissolve, because lipids require neutral pH", w:"Membrane lipids are not disrupted by a shift of this size."},
     {t:"DNA sequence is altered", w:"pH does not rewrite the base sequence."},
     {t:"Nothing — 0.3 units is within the normal range", w:"Normal is 7.35–7.45; 7.10 is dangerous acidosis, and the scale is logarithmic."}],
  e:"Every pH question comes back to protein shape. Shape is function."},
 {id:"chem-q3", o:2, v:"A phospholipid is dropped into a beaker of water.",
  s:"What arrangement will it spontaneously adopt, and why?",
  a:[{t:"Tails turned inward away from water, heads facing the water — because the heads are polar and the tails are not", ok:true,
      w:"This is exactly why a bilayer forms without any energy input."},

 {id:"cell-c14", f:"Sodium-potassium pump", b:"Uses one ATP to push 3 Na⁺ out and pull 2 K⁺ in, against both gradients.",

 {id:"cell-c15", f:"Secondary active transport", b:"Moves a substance against its gradient by riding the downhill flow of another (usually Na⁺). No ATP is used at this step.",
  why:"The ATP was spent earlier, building the Na⁺ gradient. This is how glucose is absorbed from the gut against its gradient."},
 {id:"cell-c16", f:"Endocytosis", b:"The membrane engulfs material into a vesicle: phagocytosis (solids), pinocytosis (fluid), receptor-mediated (specific molecules).",

 {id:"cell-c17", f:"Exocytosis", b:"A vesicle fuses with the plasma membrane and releases its contents outside the cell.",

 {id:"tis-c1", f:"The four primary tissue types", b:"Epithelial (covers and lines), connective (supports and binds), muscle (contracts), nervous (communicates).",
  why:"Every organ in the body is some combination of these four."},
 {id:"tis-c2", f:"Defining features of epithelium", b:"Cells packed tightly with little matrix, polarity (apical and basal surfaces), anchored to a basement membrane, avascular but innervated, and rapidly regenerating.",
  why:"Avascular is the key one: epithelium gets nutrients by diffusion from the connective tissue beneath, which limits how thick it can be."},
 {id:"tis-c3", f:"Naming epithelium", b:"First the layers — simple (one) or stratified (many); then the shape of the surface cells — squamous (flat), cuboidal, or columnar.",

 {id:"tis-c4", f:"Simple squamous epithelium", b:"A single layer of flat cells. Built for rapid diffusion and filtration. Found in alveoli, capillaries and serous membranes.",

 {id:"tis-c5", f:"Simple cuboidal epithelium", b:"A single layer of cube-shaped cells for secretion and absorption. Found in kidney tubules and gland ducts.",

 {id:"tis-c6", f:"Simple columnar epithelium", b:"A single layer of tall cells lining the digestive tract, often with microvilli and goblet cells.",

 {id:"tis-c7", f:"Pseudostratified ciliated columnar", b:"One layer where every cell touches the basement membrane, but nuclei sit at different heights, so it looks layered. Lines the airways.",

 {id:"tis-c8", f:"Stratified squamous epithelium", b:"Many layers built for protection against abrasion. Keratinized in the epidermis; non-keratinized in the mouth, esophagus and vagina.",
  why:"Layers wear away from the top and are replaced from the bottom — a surface designed to be sacrificed."},
 {id:"tis-c9", f:"Transitional epithelium", b:"Stretches and flattens as an organ fills. Found in the bladder, ureters and urethra.",
  why:"Its cells change shape with stretch, which is exactly what a reservoir organ needs."},

 {id:"tis-c11", f:"The three parts of connective tissue", b:"Cells, fibers and ground substance. Fibers plus ground substance make the matrix.",

 {id:"tis-c14", f:"Adipose tissue", b:"Cells filled with a single large fat droplet that pushes the nucleus aside; stores energy, insulates, and cushions.",

 {id:"tis-c17", f:"Cartilage", b:"Chondrocytes sitting in small cavities (lacunae) within a firm matrix. Avascular, with no nerves.",

qs:[

blurb:"Skin layers and their cells, the appendages, and why burns and skin cancer are graded the way they are.",
cards:[
 {id:"skin-c1", f:"Layers of the epidermis (deep to superficial)", b:"Stratum basale, spinosum, granulosum, lucidum (thick skin only), corneum.",

  why:"The papillae create the ridges that give fingerprints — and they bring blood close to the avascular epidermis."},
 {id:"skin-c8", f:"Reticular layer of the dermis", b:"The deep, thick layer of dense irregular connective tissue with collagen and elastic fibers.",

 {id:"skin-c9", f:"Hypodermis (subcutaneous layer)", b:"Mostly adipose tissue beneath the dermis; anchors skin to underlying structures, insulates and cushions.",

 {id:"skin-c11", f:"Vitamin D synthesis", b:"UV light converts a cholesterol derivative in the epidermis into a vitamin D precursor, later activated by liver and kidney.",
  why:"Vitamin D is required to absorb calcium — linking sunlight directly to bone strength."},
 {id:"skin-c12", f:"Eccrine (merocrine) sweat glands", b:"The most numerous sweat glands; open directly onto the skin surface and secrete watery sweat for cooling.",

 {id:"skin-c13", f:"Apocrine sweat glands", b:"Found mainly in the axillary and genital regions; secrete a protein- and lipid-rich fluid into hair follicles, beginning at puberty.",

 {id:"skin-c17", f:"First-degree burn", b:"Epidermis only. Redness and pain, no blisters. Heals in a few days.",

blurb:"Bone as a living, constantly rebuilt organ — its microscopic structure, how it grows, and its role in calcium balance.",
cards:[
 {id:"bone-c1", f:"Functions of the skeletal system", b:"Support, protection, movement (levers for muscles), mineral storage (calcium and phosphate), blood cell formation, and triglyceride storage in yellow marrow.",
  why:"Mineral storage is the one students forget — and it is the reason bone is constantly being dismantled and rebuilt."},
 {id:"bone-c2", f:"Bone classification by shape", b:"Long (femur, humerus), short (carpals), flat (skull, sternum, ribs), irregular (vertebrae), sesamoid (patella).",
  why:"Long bones are named for shape, not size — the phalanges of your fingers are long bones."},
 {id:"bone-c3", f:"Parts of a long bone", b:"Diaphysis (shaft), epiphyses (ends), metaphysis between them, articular cartilage on joint surfaces, periosteum outside, endosteum lining the medullary cavity.",
  why:"The medullary cavity holds marrow; the periosteum carries the blood vessels and the cells that grow and repair the bone."},
 {id:"bone-c4", f:"Compact vs. spongy bone", b:"Compact bone is dense and forms the outer shell; spongy (cancellous) bone is an open lattice of trabeculae at the ends and inside flat bones.",
  why:"Spongy bone is not weak — its trabeculae align along lines of stress, giving strength at a fraction of the weight."},
 {id:"bone-c5", f:"Osteon (Haversian system)", b:"The structural unit of compact bone: a central canal carrying vessels, surrounded by concentric rings of matrix (lamellae) with osteocytes in lacunae between them.",
  why:"Compact bone is built as a bundle of these cylinders, all running along the bone's long axis — the direction of greatest stress."},
 {id:"bone-c6", f:"Canaliculi", b:"Tiny channels connecting lacunae to each other and to the central canal, allowing osteocytes to exchange nutrients and wastes.",
  why:"Bone matrix is solid, so nothing diffuses through it. Without canaliculi, every osteocyte would suffocate."},
 {id:"bone-c7", f:"The four bone cells", b:"Osteogenic (stem cells), osteoblasts (build matrix), osteocytes (mature cells that maintain it), osteoclasts (dissolve it).",
  why:"Blasts Build, Clasts Consume. Balance between the two determines whether bone mass rises or falls."},
 {id:"bone-c8", f:"Bone matrix composition", b:"About one-third organic (mostly collagen) and two-thirds inorganic (hydroxyapatite — calcium phosphate crystals).",
  why:"Collagen gives flexibility and tensile strength; mineral gives hardness and compressive strength. Bone needs both."},
 {id:"bone-c9", f:"Intramembranous ossification", b:"Bone forms directly within a fibrous membrane. Produces the flat bones of the skull and the clavicles.",
  why:"No cartilage model is involved — which is why a newborn's skull still has soft fontanelles."},
 {id:"bone-c10", f:"Endochondral ossification", b:"A hyaline cartilage model is gradually replaced by bone. Forms most bones in the body.",
  why:"The cartilage is not converted into bone — it is destroyed and replaced. An important distinction."},
 {id:"bone-c11", f:"Epiphyseal plate", b:"A disc of hyaline cartilage between epiphysis and diaphysis where lengthwise growth occurs during childhood.",
  why:"When it ossifies at the end of puberty it becomes the epiphyseal line, and growth in length ends permanently."},
 {id:"bone-c12", f:"Appositional growth", b:"Growth in width: osteoblasts beneath the periosteum add bone to the outside while osteoclasts widen the medullary cavity from inside.",
  why:"This continues throughout life, which is why bones thicken in response to load long after height is fixed."},
 {id:"bone-c13", f:"Bone remodeling", b:"Ongoing replacement of old matrix by osteoclast resorption followed by osteoblast deposition; about 5–10% of the skeleton is replaced each year.",
  why:"The adult skeleton is not a finished object. It is a structure in continuous turnover."},
 {id:"bone-c14", f:"Wolff's law", b:"Bone remodels in response to the mechanical stresses placed on it — it thickens where loaded and thins where it is not.",
  why:"Explains athletes' denser bones, bone loss during bed rest and spaceflight, and why weight-bearing exercise is prescribed for osteoporosis."},
 {id:"bone-c15", f:"Parathyroid hormone (PTH)", b:"Released when blood calcium falls. Stimulates osteoclasts, increases calcium reabsorption by the kidney, and promotes activation of vitamin D.",
  why:"PTH defends blood calcium at the skeleton's expense — the body will sacrifice bone before it will let blood calcium drop."},
 {id:"bone-c16", f:"Calcitonin", b:"Released by the thyroid when blood calcium is high; inhibits osteoclasts, lowering blood calcium.",
  why:"The opposing hand to PTH, though far weaker in adults."},
 {id:"bone-c17", f:"Why blood calcium is defended so tightly", b:"Calcium is required for nerve impulse transmission, muscle contraction and blood clotting.",
  why:"Too low causes tetany and spasm; too high causes weakness and cardiac arrhythmia. Neither is survivable for long."},
 {id:"bone-c18", f:"Stages of fracture repair", b:"Hematoma forms → fibrocartilaginous (soft) callus → bony (hard) callus → remodeling.",
  why:"The soft callus is temporary scaffolding — it is replaced by bone, then sculpted back toward the original shape."},
 {id:"bone-c19", f:"Axial vs. appendicular skeleton", b:"Axial: skull, vertebral column, thoracic cage. Appendicular: limbs plus the pectoral and pelvic girdles that attach them.",
  why:"Axial protects and supports along the midline; appendicular moves."},
 {id:"bone-c20", f:"Osteoporosis", b:"Bone resorption outpaces deposition, so bone mass and density fall and fracture risk rises sharply.",
  why:"The matrix that remains is normal — there is simply less of it. Most common after menopause, when estrogen's restraint on osteoclasts is lost."},
 {id:"bone-c21", f:"Bone marking vocabulary", b:"Projections: process, tubercle, trochanter, condyle, epicondyle. Depressions and openings: fossa, foramen, meatus, sinus.",
  why:"Projections are where things attach or articulate; openings are where vessels and nerves pass."},
 {id:"bone-c22", f:"Red vs. yellow marrow", b:"Red marrow makes blood cells; yellow marrow stores fat. In adults red marrow persists mainly in flat bones, vertebrae and the proximal femur and humerus.",
  why:"This is why a bone marrow biopsy is taken from the hip — that is where the active marrow still is."}
],
qs:[
 {id:"bone-q1", o:2, v:"A patient's blood calcium falls. Over the next hours, PTH is released.",
  s:"What happens to the bone, and why is the body willing to accept that cost?",
  a:[{t:"Osteoclasts break down bone matrix to release calcium, because blood calcium is needed for nerve and heart function", ok:true,
      w:"The skeleton is a mineral reservoir, and blood calcium takes priority over bone density."},
     {t:"Osteoblasts add matrix, trapping calcium in bone", w:"That would lower blood calcium further — the opposite of what is needed."},
     {t:"Nothing happens to bone; only the kidney responds", w:"The kidney does respond, but bone is a major source of the calcium."},
     {t:"Calcitonin is released instead", w:"Calcitonin is released when calcium is high, not low."}],
  e:"When blood calcium and bone strength conflict, blood calcium wins every time."},
 {id:"bone-q2", o:2, v:"An astronaut returns after six months in microgravity with measurably reduced bone density, especially in the legs and spine.",
  s:"Which principle explains this?",
  a:[{t:"Wolff's law — bone remodels according to the mechanical stress placed on it", ok:true,
      w:"Without weight bearing, resorption outpaces deposition in the load-bearing bones."},
     {t:"The epiphyseal plates reopened", w:"Plates do not reopen after closure, and this is a density change, not a length change."},
     {t:"Calcium intake fell below requirement", w:"Diet is controlled; the loss is driven by unloading."},
     {t:"Osteocytes died from lack of oxygen", w:"The mechanism is remodeling balance, not hypoxia."}],
  e:"Bone invests where it is used and divests where it is not."},
 {id:"bone-q3", o:2, v:"A 14-year-old fractures the distal femur through the epiphyseal plate.",
  s:"What is the specific long-term concern?",
  a:[{t:"Damage to the growth plate may stop or distort growth in that limb's length", ok:true,
      w:"The plate is the only site of lengthwise growth, and it has not yet closed at this age."},
     {t:"The bone will never heal, because cartilage is avascular", w:"Fractures through the plate do heal; the concern is growth disturbance."},
     {t:"The medullary cavity will fill with compact bone", w:"Not a consequence of growth plate injury."},
     {t:"Nothing, because lengthwise growth occurs at the periosteum", w:"The periosteum handles width, not length."}],
  e:"Growth plate injuries in children are graded and followed carefully for this reason alone."},
 {id:"bone-q4", o:2, v:"A bone is soaked in acid, dissolving away its mineral. A second bone is baked, destroying its collagen.",
  s:"What happens to each?",
  a:[{t:"The acid-treated bone becomes rubbery and bends; the baked bone becomes brittle and shatters", ok:true,
      w:"Collagen supplies flexibility and tensile strength, mineral supplies hardness."},
     {t:"Both become brittle", w:"Removing mineral leaves flexible collagen behind."},
     {t:"Both become rubbery", w:"Removing collagen leaves rigid, fragile mineral."},
     {t:"Neither changes, because both components are structural", w:"Each loss produces a dramatic and opposite change."}],
  e:"This classic demonstration is the clearest way to see why bone needs both components."},
 {id:"bone-q5", o:1, s:"What is the function of canaliculi?",
  a:[{t:"Tiny channels that let osteocytes exchange nutrients and wastes through solid matrix", ok:true,
      w:"They connect lacuna to lacuna and out to the central canal."},
     {t:"They carry the main blood vessels through bone", w:"That is the central (Haversian) canal."},
     {t:"They store calcium salts", w:"Calcium is in the matrix itself."},
     {t:"They are the spaces where osteocytes sit", w:"Those are the lacunae."}],
  e:"Solid matrix is impermeable, so bone had to evolve plumbing."},
 {id:"bone-q6", o:1, s:"Place the stages of fracture repair in order.",
  a:[{t:"Hematoma → soft (fibrocartilaginous) callus → hard (bony) callus → remodeling", ok:true,
      w:"Clot, temporary bridge, bone bridge, then sculpting."},
     {t:"Soft callus → hematoma → remodeling → hard callus", w:"Bleeding comes first; remodeling comes last."},
     {t:"Hematoma → hard callus → soft callus → remodeling", w:"The soft callus precedes and is replaced by the hard one."},
     {t:"Remodeling → hematoma → soft callus → hard callus", w:"Remodeling is the final refinement."}],
  e:"Every repair follows the same arc: stabilize, bridge with something soft, convert to bone, refine."},
 {id:"bone-q7", o:2, v:"A drug is developed that inhibits osteoclast activity. It is prescribed for osteoporosis.",
  s:"What is the intended effect, and what is a predictable risk?",
  a:[{t:"Slowing resorption to preserve bone mass — but reduced turnover can leave older, more fragile matrix in place", ok:true,
      w:"Remodeling also removes microdamage; suppressing it indefinitely has its own costs."},
     {t:"Stimulating osteoblasts to build new bone — with a risk of bones growing too long", w:"The drug inhibits breakdown; it does not drive growth, and length is fixed after plate closure."},
     {t:"Raising blood calcium — with a risk of tetany", w:"Tetany comes from low calcium, not high."},
     {t:"Reopening the epiphyseal plates — with a risk of abnormal height", w:"Plates cannot reopen."}],
  e:"Remodeling is maintenance, not just loss. Shut it down entirely and repair stops too."},
 {id:"bone-q8", o:2, s:"Why does an adult need red marrow at all, and where is most of it found?",
  a:[{t:"To make blood cells — mainly in flat bones, vertebrae, and the proximal femur and humerus", ok:true,
      w:"Which is why marrow biopsies are taken from the iliac crest."},
     {t:"To store fat — mainly in the medullary cavity of long bones", w:"That describes yellow marrow."},
     {t:"To store calcium — throughout the skeleton", w:"Calcium is stored in the matrix, not the marrow."},
     {t:"To produce osteoclasts only — in the epiphyses", w:"Red marrow produces all blood cell lines."}],
  e:"Red marrow retreats to the axial skeleton with age; yellow marrow takes over the long bone shafts."},
 {id:"bone-q9", o:1, s:"Which type of ossification forms the flat bones of the skull?",
  a:[{t:"Intramembranous ossification", ok:true, w:"Bone forms directly within a fibrous membrane, with no cartilage model."},
     {t:"Endochondral ossification", w:"That replaces a hyaline cartilage model and forms most other bones."},
     {t:"Appositional growth", w:"That is growth in width of an existing bone."},
     {t:"Interstitial growth", w:"Growth in length from within cartilage, at the epiphyseal plate."}],
  e:"Skull and clavicles are the exceptions; nearly everything else is endochondral."},
 {id:"bone-q10", o:2, v:"A postmenopausal woman is found to have significantly reduced bone density, though the bone matrix present is chemically normal.",
  s:"What has happened, and why is menopause relevant?",
  a:[{t:"Resorption has outpaced deposition; the loss of estrogen removes a brake on osteoclast activity", ok:true,
      w:"Osteoporosis is a quantity problem, not a quality problem."},
     {t:"The matrix has become undermineralized due to vitamin D deficiency", w:"That is osteomalacia, where matrix is present but poorly mineralized."},
     {t:"Osteoblasts have begun producing abnormal collagen", w:"The matrix composition is described as normal."},
     {t:"The epiphyseal plates have reopened and weakened the bone", w:"Plates do not reopen."}],
  e:"Osteoporosis: normal bone, less of it. Osteomalacia: enough matrix, not enough mineral."}
]});

/* ---------------------------------------------------------- 8. JOINTS */
UNITS.push({
id:"jnt", name:"Joints & Movement", short:"Joints",
blurb:"How bones are joined, the trade-off between mobility and stability, and the vocabulary of movement.",
cards:[
 {id:"jnt-c1", f:"Structural classification of joints", b:"Fibrous (joined by dense connective tissue), cartilaginous (joined by cartilage), synovial (joined by a fluid-filled capsule).",
  why:"Structural classification asks what material joins the bones; functional classification asks how much it moves."},
 {id:"jnt-c2", f:"Functional classification of joints", b:"Synarthrosis (immovable), amphiarthrosis (slightly movable), diarthrosis (freely movable).",
  why:"All synovial joints are diarthroses. The reverse is also true — free movement requires a joint cavity."},
 {id:"jnt-c3", f:"Fibrous joints", b:"Sutures (skull), syndesmoses (bones joined by a ligament, as between tibia and fibula), gomphoses (tooth in its socket).",
  why:"Mobility depends on how long the connecting fibers are — short in sutures, longer in syndesmoses."},
 {id:"jnt-c4", f:"Cartilaginous joints", b:"Synchondroses joined by hyaline cartilage (epiphyseal plate, first rib to sternum); symphyses joined by fibrocartilage (pubic symphysis, intervertebral discs).",
  why:"Symphyses are built to absorb compression while allowing a little give — exactly what a spine needs."},
 {id:"jnt-c5", f:"Structure of a synovial joint", b:"Articular (hyaline) cartilage, a joint cavity holding synovial fluid, a two-layered capsule (fibrous outside, synovial membrane inside), reinforcing ligaments, and a nerve and blood supply.",
  why:"Every freely movable joint in the body is built to this one plan."},
 {id:"jnt-c6", f:"Synovial fluid", b:"A slippery filtrate of blood with hyaluronic acid; lubricates, absorbs shock, and nourishes the articular cartilage.",
  why:"Articular cartilage is avascular, so it is fed by this fluid — and the fluid is pushed into it by movement. Immobility starves cartilage."},
 {id:"jnt-c7", f:"Bursae and tendon sheaths", b:"Flattened sacs of synovial fluid that reduce friction where tendons, ligaments, skin or bone rub together.",
  why:"Inflame one and you have bursitis — a common cause of shoulder and knee pain that is not a joint problem at all."},
 {id:"jnt-c8", f:"Menisci (articular discs)", b:"Pads of fibrocartilage inside some synovial joints, such as the knee, that improve fit and absorb shock.",
  why:"They deepen a shallow joint surface. Torn menisci heal poorly because fibrocartilage is largely avascular."},
 {id:"jnt-c9", f:"The six synovial joint types", b:"Plane (intercarpal), hinge (elbow), pivot (atlantoaxial), condylar (knuckles), saddle (thumb), ball-and-socket (shoulder, hip).",
  why:"Listed roughly from least to most movement. Shape dictates the axes of movement available."},
 {id:"jnt-c10", f:"Stability vs. mobility", b:"The more movement a joint allows, the less inherently stable it is.",
  why:"The shoulder is the most mobile joint and the most frequently dislocated; the hip trades range for a deep, secure socket."},
 {id:"jnt-c11", f:"Flexion and extension", b:"Flexion decreases the angle between bones; extension increases it. Hyperextension goes beyond anatomical position.",
  why:"Defined in the sagittal plane. Always name the movement from anatomical position."},
 {id:"jnt-c12", f:"Abduction and adduction", b:"Abduction moves a limb away from the midline; adduction moves it toward the midline.",
  why:"Abduct = take away. Adduct = add to the body."},
 {id:"jnt-c13", f:"Circumduction", b:"Moving a limb so its distal end traces a circle while the proximal end stays fixed — a cone-shaped movement.",
  why:"It is a sequence of flexion, abduction, extension and adduction, not a separate motion."},
 {id:"jnt-c14", f:"Supination and pronation", b:"Supination turns the palm anteriorly (anatomical position); pronation turns it posteriorly, crossing the radius over the ulna.",
  why:"Supination is the position of anatomical position — and the position in which you hold a bowl of soup."},
 {id:"jnt-c15", f:"Dorsiflexion and plantar flexion", b:"Dorsiflexion lifts the toes toward the shin; plantar flexion points the toes downward.",
  why:"Plantar flexion presses the sole of the foot down, as in standing on tiptoe."},
 {id:"jnt-c16", f:"Inversion and eversion", b:"Inversion turns the sole medially; eversion turns it laterally.",
  why:"Most ankle sprains are inversion injuries, tearing the lateral ligaments."},
 {id:"jnt-c17", f:"Sprain vs. strain", b:"A sprain is a torn or stretched ligament; a strain is a torn or stretched muscle or tendon.",
  why:"Ligament connects bone to bone; tendon connects muscle to bone. That distinction is the whole difference."},
 {id:"jnt-c18", f:"Osteoarthritis", b:"Wear-and-tear degeneration of articular cartilage; the most common form of arthritis, worsening with age and load.",
  why:"Because cartilage is avascular and does not regenerate, the damage accumulates rather than healing."},
 {id:"jnt-c19", f:"Rheumatoid arthritis", b:"An autoimmune disease in which the immune system attacks the synovial membrane, causing inflammation, pannus formation and joint destruction.",
  why:"Typically symmetrical and can begin at any age — both features distinguish it from osteoarthritis."}
],
qs:[
 {id:"jnt-q1", o:2, v:"The shoulder allows more movement than any other joint in the body, and it is also the most commonly dislocated.",
  s:"What principle does this illustrate?",
  a:[{t:"Mobility and stability trade off against each other", ok:true,
      w:"A shallow socket permits enormous range and gives up bony security in return."},
     {t:"Ball-and-socket joints are inherently weak structures", w:"The hip is also ball-and-socket and is very stable — its socket is deep."},
     {t:"The shoulder lacks ligaments", w:"It has ligaments and a rotator cuff; they simply cannot fully compensate for the shallow socket."},
     {t:"Dislocation is caused by synovial fluid excess", w:"Fluid volume is not the mechanism."}],
  e:"Compare shoulder and hip side by side and the whole principle becomes obvious."},
 {id:"jnt-q2", o:2, v:"A patient's knee is immobilized in a cast for ten weeks. On removal, the articular cartilage shows signs of thinning.",
  s:"Why does immobility damage cartilage?",
  a:[{t:"Articular cartilage is avascular and is nourished by synovial fluid driven into it by joint movement", ok:true,
      w:"No movement means no fluid exchange, so the cartilage is effectively starved."},
     {t:"Cartilage requires constant blood flow, which stops when a joint is still", w:"Cartilage has no blood supply at all."},
     {t:"The cast compresses the cartilage and crushes it", w:"The described mechanism is nutritional, not mechanical."},
     {t:"Synovial fluid becomes acidic when not stirred", w:"Not a recognized mechanism."}],
  e:"“Motion is lotion” — the physiology behind early mobilization after joint surgery."},
 {id:"jnt-q3", o:1, s:"The elbow is which type of synovial joint?",
  a:[{t:"Hinge — movement in one plane only", ok:true, w:"Flexion and extension, a single axis."},
     {t:"Pivot — rotation around a long axis", w:"That describes the atlantoaxial joint and the proximal radioulnar joint."},
     {t:"Ball-and-socket — movement in all planes", w:"That is the shoulder and hip."},
     {t:"Saddle — movement in two planes with opposition", w:"That is the thumb's carpometacarpal joint."}],
  e:"Name the joint from the number of axes it moves through."},
 {id:"jnt-q4", o:2, v:"A runner rolls her ankle so that the sole of the foot turns inward, and tears a ligament on the outer side of the ankle.",
  s:"Name the movement and the injury.",
  a:[{t:"Inversion — a sprain of the lateral ligaments", ok:true,
      w:"Inversion stretches the lateral side, which is why lateral ankle sprains are by far the most common."},
     {t:"Eversion — a strain of the lateral tendons", w:"Eversion turns the sole outward, and a strain involves muscle or tendon, not ligament."},
     {t:"Plantar flexion — a sprain of the Achilles tendon", w:"The Achilles is a tendon, so injuring it is a strain, and the movement described is not plantar flexion."},
     {t:"Dorsiflexion — a dislocation", w:"Neither the movement nor the injury matches."}],
  e:"Sprain = ligament. Strain = muscle or tendon. The word choice is itself an exam question."},
 {id:"jnt-q5", o:2, s:"The epiphyseal plate is classified as which type of joint, and why does that classification disappear in adulthood?",
  a:[{t:"A synchondrosis — it ossifies at maturity and the two bones fuse into one", ok:true,
      w:"A cartilaginous joint joined by hyaline cartilage, temporary by design."},
     {t:"A symphysis — it is replaced by fibrocartilage", w:"Symphyses are fibrocartilage and persist; the plate is hyaline and disappears."},
     {t:"A synovial joint — it loses its joint cavity", w:"There is no joint cavity in a growth plate."},
     {t:"A syndesmosis — the ligament calcifies", w:"No ligament is involved."}],
  e:"A useful reminder that some joints exist only for a stage of life."},
 {id:"jnt-q6", o:1, s:"Which movement turns the palm to face anteriorly?",
  a:[{t:"Supination", ok:true, w:"The position of the forearm in anatomical position."},
     {t:"Pronation", w:"Turns the palm posteriorly, crossing radius over ulna."},
     {t:"Abduction", w:"Moves a limb away from the midline."},
     {t:"Circumduction", w:"Traces a cone with the limb."}],
  e:"Supination holds soup. Pronation pours it out."},
 {id:"jnt-q7", o:2, v:"A patient has painful, swollen joints in both hands, symmetrically, with morning stiffness lasting two hours. She is 34.",
  s:"Which arthritis does this picture suggest, and what is the underlying mechanism?",
  a:[{t:"Rheumatoid arthritis — autoimmune attack on the synovial membrane", ok:true,
      w:"Symmetry, young age and prolonged morning stiffness all point away from wear-and-tear disease."},
     {t:"Osteoarthritis — mechanical wear of articular cartilage", w:"Typically asymmetric, load-related, older, with brief morning stiffness."},
     {t:"Gout — crystal deposition", w:"Classically sudden, severe and in one joint, often the great toe."},
     {t:"Bursitis — inflammation of a friction sac", w:"Localized to one bursa, not symmetrical across many joints."}],
  e:"Symmetry plus prolonged morning stiffness is the classic rheumatoid pattern."},
 {id:"jnt-q8", o:2, s:"Why is a torn meniscus slow to heal, while a torn joint capsule heals reasonably well?",
  a:[{t:"The meniscus is fibrocartilage and largely avascular; the capsule is vascularized connective tissue", ok:true,
      w:"Blood supply again predicts healing."},
     {t:"The meniscus is under greater mechanical load", w:"Load matters, but the decisive difference is blood supply."},
     {t:"The capsule contains stem cells and the meniscus does not", w:"Not the standard explanation."},
     {t:"The meniscus is made of bone", w:"It is fibrocartilage."}],
  e:"Third time this course: avascular structures heal badly. Cartilage, meniscus, cornea."},
 {id:"jnt-q9", o:1, s:"Which joint type is found between the carpals of the wrist?",
  a:[{t:"Plane (gliding) joints", ok:true, w:"Flat surfaces sliding across one another, allowing small multidirectional movement."},
     {t:"Hinge joints", w:"Single-axis joints like the elbow."},
     {t:"Saddle joints", w:"Only the thumb's carpometacarpal joint."},
     {t:"Pivot joints", w:"Rotation around a long axis."}],
  e:"Many small gliding movements add up to the wrist's overall flexibility."},
 {id:"jnt-q10", o:2, v:"A painter develops shoulder pain after weeks of overhead work. The joint itself moves normally, but a fluid-filled sac above the joint is tender and swollen.",
  s:"What is the most likely diagnosis?",
  a:[{t:"Bursitis — inflammation of a friction-reducing sac, not the joint itself", ok:true,
      w:"Bursae sit where tendon or skin rubs over bone, and repeated overhead motion inflames them."},
     {t:"Osteoarthritis of the shoulder", w:"The joint itself is described as moving normally."},
     {t:"A rotator cuff tear", w:"Possible with overhead work, but the described finding points to the bursa."},
     {t:"Dislocation", w:"The joint is not displaced."}],
  e:"Not all joint pain is joint disease. Bursae and tendon sheaths are common culprits."}
]});
